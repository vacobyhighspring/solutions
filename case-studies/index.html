      <div class="fstats">${f.stats.slice(0,4).map(s=>`<div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div></div>
      ${rest.length?`<div class="sec-head" style="margin-top:34px;margin-bottom:0"><div><div class="eyebrow">Also in this set</div></div><span class="results">Click “Feature this” to swap the spotlight</span></div>
      <div class="minis">${rest.map(c=>`<div class="mini fade"><b>${esc(c.stats[0].value)}</b><div><small>${esc(c.industryGroup)} · ${esc(c.serviceGroup)}</small><h4>${esc(c.title)}</h4>
        <button class="feature-btn" data-feature="${col.slug}|${c.id}">Feature this</button> · <button class="feature-btn" data-open="${c.id}">Read →</button> ${rm(c)}</div></div>`).join('')}</div>`:''}`;
  }
  return `<div class="sec-head"><div><div class="eyebrow">One-pager</div><h2>Engagement summary</h2></div><button class="linkbtn" data-expandall>Expand all</button></div>
  <div class="op"><div class="op-h"><span>#</span><span>Engagement</span><span class="ch">The challenge</span><span class="svc">Service</span><span>Result</span><span></span></div>
  ${cs.map((c,i)=>`<button class="op-r" aria-expanded="false" data-row="${c.id}"><span class="idx">${pad(i+1)}</span><span><span class="t">${esc(c.title)}</span><span class="c" style="display:block">${esc(c.client)} · ${esc(c.state)}</span></span>
    <span class="ch">${esc(c.challenge.split(/(?<=\.)\s/)[0])}</span><span class="svc"><span class="svc-tag" style="margin:0">${esc(c.serviceGroup)}</span><span class="c" style="display:block;margin-top:4px">${esc(c.primary)}</span></span>
    <span class="res"><b>${esc(c.stats[0].value)}</b><span>${esc(c.stats[0].label)}</span></span><span class="chev">›</span></button>
    <div class="op-x" id="opx-${c.id}"><div class="cols">${STEPS.map(([k,t])=>`<div><h5>${t}</h5><p>${esc(c[k].split('\n')[0])}</p></div>`).join('')}</div>
    <div class="more"><button class="linkbtn" data-open="${c.id}">Open full case study →</button> ${rm(c)}</div></div>`).join('')}</div>`;
}

/* ---------- drawer ---------- */
function openDrawer(id){
  const c=BYID[id]; const d=$('#drawer');
  d.innerHTML = `<div class="dh"><button class="x" data-close aria-label="Close">×</button><div class="eyebrow">Case study · ${esc(c.industryGroup)}</div><h2>${esc(c.title)}</h2>
    <div class="client-line" style="color:#c9d6e2;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">${esc(c.client)} ${c.placement?`<span class="placement">${esc(c.placement)}</span>`:''}</div>${metaBlock(c,false)}</div>
    <div class="db">${statBlock(c)}<div style="height:22px"></div>${stackStory(c)}
    ${c.quote?`<div class="quote"><blockquote>${esc(c.quote.text)}</blockquote><cite>— ${esc(c.quote.by)}</cite></div>`:''}
    ${CFG.lock?'':`<div style="margin-top:24px"><a class="btn" href="#case-${c.id}" data-close>Open as full page →</a></div>`}</div>`;
  d.classList.add('show'); d.setAttribute('aria-hidden','false'); $('#scrim').classList.add('show'); d.scrollTop=0;
  d.querySelectorAll('.stat').forEach(s=>s.classList.add('vis'));
  d.querySelector('.x').focus();
}
function closeDrawer(){ $('#drawer').classList.remove('show'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('show'); }

/* ---------- tray ---------- */
function renderTray(view){
  const t=$('#tray');
  if (CFG.lock || !S.sel.length || (view==='collection'&&S._col==='custom')){ t.classList.remove('show'); return; }
  t.innerHTML = `<span><b>${S.sel.length}</b> case ${S.sel.length===1?'study':'studies'} in your set</span><button class="linkbtn" style="color:#8fb3cf" data-clearsel>Clear</button><a class="btn" href="#col-custom">Build collection →</a>`;
  t.classList.add('show');
}
function toggleSel(id){
  const i=S.sel.indexOf(id); if(i>=0) S.sel.splice(i,1); else S.sel.push(id); persist();
  document.querySelectorAll(`[data-add="${id}"]`).forEach(b=>{ const on=S.sel.includes(id); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on);
    if(!b.classList.contains('rm')) b.textContent= b.closest('.case-actions')? (on?'✓ In your set':'+ Add to custom set') : (on?'✓ Added':'+ Add to set'); });
  renderNav(S._view); renderTray(S._view);
  if (S._view==='collection'&&S._col==='custom') renderCollection('custom');
  toast(S.sel.includes(id)?'Added to your set':'Removed from your set');
}

/* ---------- router ---------- */
function route(){
  closeDrawer();
  let h=location.hash.slice(1);
  if (CFG.lock){ h = CFG.lock; }
  let view='library';
  if (/^case-\d+$/.test(h)){ view='case'; renderCase(+h.split('-')[1]); }
  else if (h==='collections'){ view='collections'; renderCollections(); }
  else if (/^col-[\w-]+$/.test(h)){ view='collection'; S._col=h.slice(4); renderCollection(h.slice(4)); }
  else { renderLibrary(); }
  S._view=view; renderNav(view); renderTray(view);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
async function dlCase(id,btn){
  const c=BYID[id]; if(!c) return;
  let html='';
  try{ const r=await fetch(location.href.split('#')[0],{cache:'no-store'}); if(r.ok) html=await r.text(); }catch(err){}
  if(!html||html.indexOf('const CFG = {};')<0) html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  html=html.replace('const CFG = {};','const CFG = {"lock":"case-'+id+'"};');
  html=html.replace(/<title>[^<]*<\/title>/,'<title>'+c.title.replace(/[<&]/g,'')+' · Case Study · Highspring | Vaco</title>');
  const slug=c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=slug+'.html'; document.body.appendChild(a); a.click(); a.remove();
  if(btn){ const o=btn.textContent; btn.textContent='Downloaded'; setTimeout(()=>btn.textContent=o,1600); }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  const d=t.dataset;
  if (d.dl){ e.preventDefault(); dlCase(+d.dl, t); return; }
  if (d.add){ e.preventDefault(); e.stopPropagation(); toggleSel(+d.add); return; }
  if (d.ftab){ S.ftab=d.ftab; renderFilters(); return; }
  if (d.chip!==undefined){ const set=S.f[S.ftab]; set.has(d.chip)?set.delete(d.chip):set.add(d.chip); renderFilters(); renderGrid(); return; }
  if (d.unchip){ const [k,...v]=d.unchip.split('|'); S.f[k].delete(v.join('|')); renderFilters(); renderGrid(); return; }
  if (d.clear!==undefined){ Object.values(S.f).forEach(s=>s.clear()); S.q=''; renderFilters(); renderGrid(); return; }
  if (d.filter){ e.preventDefault(); const [k,...v]=d.filter.split('|'); Object.values(S.f).forEach(s=>s.clear()); S.q=''; S.f[k].add(v.join('|')); S.ftab=k; if(location.hash==='#library') route(); else location.hash='#library'; return; }
  if (d.go){ location.hash='#case-'+d.go; return; }
  if (d.mode){ S.storyMode=d.mode; route(); return; }
  if (d.step){ const [id,j]=d.step.split('|').map(Number); S.story[id]=j; $('#story').innerHTML=stepStory(BYID[id]); return; }
  if (d.layout){ const [s,l]=d.layout.split('|'); S.layouts[s]=l; renderCollection(s); return; }
  if (d.feature){ const [s,id]=d.feature.split('|'); S.featured[s]=+id; $('#colbody').innerHTML=layoutHTML(colDef(s),'featured'); $('#colbody').scrollIntoView({behavior:'smooth'}); return; }
  if (d.open){ openDrawer(+d.open); return; }
  if (d.close!==undefined){ closeDrawer(); return; }
  if (d.row){ const x=$('#opx-'+d.row), open=!x.classList.contains('open'); x.classList.toggle('open',open); t.setAttribute('aria-expanded',open); return; }
  if (d.expandall!==undefined){ const rows=document.querySelectorAll('.op-r'), anyClosed=[...rows].some(r=>r.getAttribute('aria-expanded')==='false');
    rows.forEach(r=>{ r.setAttribute('aria-expanded',anyClosed); $('#opx-'+r.dataset.row).classList.toggle('open',anyClosed); }); t.textContent=anyClosed?'Collapse all':'Expand all'; return; }
  if (d.clearsel!==undefined){ S.sel=[]; persist(); route(); return; }
  if (d.copy){ const url=location.href.split('#')[0]+'#'+d.copy;
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Copy blocked: use the address bar')); else toast('Copy blocked: use the address bar'); return; }
});
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{
  if (e.key==='Escape') closeDrawer();
  if (S._view==='case' && S.storyMode==='steps' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const id=+(CFG.lock||location.hash).split('-').pop(); const j=Math.max(0,Math.min(2,(S.story[id]||0)+(e.key==='ArrowRight'?1:-1))); S.story[id]=j; const st=$('#story'); if(st) st.innerHTML=stepStory(BYID[id]);
  }
});
route();
</script>
</body>
</html>
