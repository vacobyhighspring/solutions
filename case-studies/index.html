<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study Library · Highspring | Vaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072942; --navy2:#0d3352; --navy3:#123c5e; --orange:#F95C15; --orange-soft:#fff0e8;
  --sky:#3BA9E6; --blue:#1A8FCF; --cyan:#2DBFF9; --bg:#F3F6F9; --bg2:#E9EFF5;
  --ink:#072942; --body:#33475b; --muted:#6b7c8d; --line:#dde5ec; --white:#fff;
  --r:8px; --shadow:0 1px 2px rgba(7,41,66,.06),0 8px 24px -12px rgba(7,41,66,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--body);background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.eyebrow:before{content:"";width:26px;height:2px;background:var(--orange);flex:none}
.eyebrow.plain:before{display:none}
.eyebrow.sky{color:var(--sky)} .eyebrow.sky:before{background:var(--sky)}
.num-tag{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:800;font-size:12px;padding:4px 8px;border-radius:3px;letter-spacing:.04em}
h1,h2,h3,h4{color:var(--ink);font-weight:800;letter-spacing:-.015em;line-height:1.12}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.brand img{height:38px;display:block}
.nav{display:flex;align-items:center;gap:8px}
.nav-hint{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--sky);margin-right:6px;white-space:nowrap}
.tab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 13px;border:1.5px solid var(--navy);border-radius:5px;color:var(--navy);transition:.15s;white-space:nowrap}
.tab:hover{border-color:var(--sky);color:var(--blue)}
.tab.on{background:var(--sky);border-color:var(--sky);color:#fff}
.tab .count{display:inline-block;margin-left:6px;background:var(--orange);color:#fff;border-radius:9px;padding:0 6px;font-size:10px}

/* ---------- hero ---------- */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--sky) 0 55%,var(--orange) 55% 100%)}
.hero .wrap{position:relative;padding-top:52px;padding-bottom:56px}
.hero h1{color:#fff;font-size:clamp(34px,4.6vw,54px);margin:16px 0 18px;max-width:860px}
.hero h1 .hl{color:var(--sky)}
.hero .lede{color:#c9d6e2;font-size:17px;max-width:680px}
.rings{position:absolute;right:-60px;top:-40px;width:420px;height:420px;opacity:.9;pointer-events:none}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid rgba(255,255,255,.14);padding-top:26px}
.hero-stats>div{padding:0 22px;border-left:2px solid var(--sky)}
.hero-stats>div:nth-child(2n){border-color:var(--orange)}
.hero-stats b{display:block;font-size:40px;font-weight:800;line-height:1;color:var(--sky)}
.hero-stats>div:nth-child(2n) b{color:var(--orange)}
.hero-stats span{display:block;margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#c9d6e2}

/* ---------- filters ---------- */
.filterbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:30}
.filterbar .wrap{padding-top:16px;padding-bottom:14px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flabel{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.ftab{font-size:13px;font-weight:700;color:var(--navy);padding:7px 12px;border-radius:5px;background:var(--bg);border:1.5px solid transparent}
.ftab.on{border-color:var(--navy);background:#fff}
.ftab i{font-style:normal;color:var(--orange);margin-left:4px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:6px;padding:0 12px;height:38px;min-width:240px;border:1.5px solid transparent}
.search:focus-within{border-color:var(--sky);background:#fff}
.search input{border:0;background:none;font:inherit;font-size:14px;outline:none;width:100%;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--body);background:#fff;transition:.12s}
.chip:hover{border-color:var(--sky)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{opacity:.6;margin-left:4px;font-weight:700}
.active-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.active-row .pill{background:var(--orange-soft);color:#b23f0a;font-weight:700;padding:4px 10px;border-radius:999px;font-size:12px}
.active-row .pill button{margin-left:6px;font-weight:800}
.linkbtn{color:var(--blue);font-weight:700;font-size:13px}
.linkbtn:hover{text-decoration:underline}

/* ---------- section ---------- */
.section{padding:44px 0}
.section.tint{background:var(--bg)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:26px;margin-top:8px}
.results{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- case cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(7,41,66,.06),0 18px 34px -14px rgba(7,41,66,.28)}
.card .strip{height:4px;background:var(--svc,var(--sky))}
.card .in{padding:20px 22px 18px;display:flex;flex-direction:column;flex:1}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.card .big{font-size:38px;font-weight:800;color:var(--navy);line-height:1;margin-top:16px;letter-spacing:-.02em}
.card .big-l{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:38px}
.card h3{font-size:17.5px;margin-top:14px;line-height:1.25}
.card .client{font-size:13px;color:var(--body);margin-top:6px}
.card .foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);margin-top:18px}
.card .go{font-size:13px;font-weight:800;color:var(--blue)}
.card .go:after{content:" →"}
.card a.cover{position:absolute;inset:0;z-index:1}
.add{position:relative;z-index:2;font-size:12px;font-weight:800;padding:6px 10px;border-radius:5px;border:1.5px solid var(--navy);color:var(--navy);display:inline-flex;gap:6px;align-items:center}
.add.on{background:var(--orange);border-color:var(--orange);color:#fff}
.svc-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--bg);color:var(--navy);margin-top:10px;margin-right:6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--bg);border-radius:var(--r)}

/* ---------- tray ---------- */
.tray{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:60;background:var(--navy);color:#fff;border-radius:10px;box-shadow:0 18px 40px -10px rgba(7,41,66,.55);display:flex;align-items:center;gap:16px;padding:12px 14px 12px 20px;transition:transform .25s,visibility .25s;max-width:calc(100% - 24px);visibility:hidden}
.tray.show{transform:translate(-50%,0);visibility:visible}
.tray b{color:var(--orange)}
.tray .btn{white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.04em;padding:10px 16px;border-radius:6px;background:var(--orange);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.ghost.dark{border-color:var(--navy);color:var(--navy)}
.btn.next{padding:8px 8px 8px 18px;border-radius:8px;box-shadow:0 8px 20px -8px rgba(249,92,21,.6)}
.btn.next small{font-size:11px;letter-spacing:.16em;opacity:.9}
.btn.next .circ{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--orange);display:grid;place-items:center;font-size:16px}

/* ---------- case page ---------- */
.crumbs{background:var(--bg);border-bottom:1px solid var(--line)}
.crumbs .wrap{display:flex;align-items:center;justify-content:space-between;height:48px;font-size:13px;font-weight:700;color:var(--navy)}
.crumbs .pn{display:flex;gap:6px;align-items:center}
.crumbs .pn button{width:30px;height:30px;border-radius:5px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.crumbs .pn button:hover{border-color:var(--navy)}
.case-hero .wrap{padding-bottom:110px}
.case-hero .rings,.col-hero .rings{opacity:.28;right:-120px}
.case-hero h1{font-size:clamp(30px,3.8vw,46px);max-width:900px}
.case-hero .client-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#c9d6e2;font-size:16px}
.placement{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.placement:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:34px}
.meta button{text-align:left;padding:4px 18px;border-left:3px solid var(--sky);color:#fff;transition:.15s}
.meta button:nth-child(2n){border-color:var(--orange)}
.meta button:hover{background:rgba(255,255,255,.05)}
.meta small{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#8fb3cf}
.meta span{display:block;font-weight:700;font-size:14.5px;margin-top:3px;line-height:1.3}
.statband{margin-top:-78px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px}
.stat{background:#fff;border-radius:var(--r);box-shadow:0 2px 6px rgba(7,41,66,.08),0 22px 40px -22px rgba(7,41,66,.4);padding:24px 24px 22px;border-top:4px solid var(--sky);opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.stat.vis{opacity:1;transform:none}
.stat:nth-child(2){border-color:var(--orange)} .stat:nth-child(3){border-color:var(--navy)} .stat:nth-child(4){border-color:var(--cyan)}
.stat b{display:block;font-size:44px;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em}
.stat p{margin-top:10px;font-size:14px;color:var(--body);line-height:1.4}
.derived{font-size:11.5px;color:var(--muted);margin-top:10px}

.story-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.story-head h2{font-size:26px;margin-top:8px}
.toggle{display:inline-flex;background:var(--bg);border-radius:7px;padding:3px}
.toggle button{font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:5px;color:var(--muted)}
.toggle button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(7,41,66,.15)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:flex;gap:16px;align-items:flex-start;text-align:left;padding:20px 22px;background:var(--bg);border-right:1px solid var(--line);transition:.18s;position:relative}
.step:last-child{border-right:0}
.step .n{font-size:44px;font-weight:800;line-height:.9;color:var(--sky)}
.step:nth-child(2) .n{color:var(--orange)} .step:nth-child(3) .n{color:var(--navy)}
.step h4{font-size:17px}
.step p{font-size:12.5px;font-weight:700;color:var(--blue);margin-top:2px}
.step.on{background:var(--navy)}
.step.on h4{color:#fff} .step.on .n{color:var(--orange)} .step.on p{color:var(--sky)}
.step:not(.on):hover{background:#fff}
.panel{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:28px 30px;margin-top:-1px}
.panel p{font-size:16px;line-height:1.7;color:var(--body);max-width:880px}
.panel p+p{margin-top:12px}
.progress{height:3px;background:var(--line);border-radius:2px;margin-top:22px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);transition:width .3s}
.panel-nav{display:flex;justify-content:space-between;margin-top:16px}
.stack .blk{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:26px 0;border-top:1px solid var(--line)}
.stack .blk:first-child{border-top:0;padding-top:4px}
.stack .blk h4{font-size:20px;display:flex;gap:12px;align-items:baseline}
.stack .blk h4 em{font-style:normal;font-size:28px;color:var(--sky)}
.stack .blk:nth-child(2) h4 em{color:var(--orange)}
.stack .blk p{font-size:15.5px;line-height:1.7}
.stack .blk p+p{margin-top:10px}

.quote{background:var(--navy);color:#fff;border-radius:var(--r);padding:34px 40px;position:relative;margin-top:28px;overflow:hidden}
.quote:before{content:"“";position:absolute;left:24px;top:-18px;font-size:150px;font-weight:800;color:var(--orange);line-height:1;opacity:.95}
.quote blockquote{font-size:18px;line-height:1.6;padding-left:72px;color:#e6eef5}
.quote cite{display:block;margin-top:14px;padding-left:72px;font-style:normal;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}

.case-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:34px}

/* ---------- collections ---------- */
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.colcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;transition:.18s;border-top:4px solid var(--sky)}
.colcard:nth-child(3n+2){border-top-color:var(--orange)} .colcard:nth-child(3n){border-top-color:var(--navy)}
.colcard:hover{transform:translateY(-3px)}
.colcard h3{font-size:20px}
.colcard p{font-size:14px}
.colcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.colcard .row .go{color:var(--blue);letter-spacing:0;font-size:13px;text-transform:none}
.colcard.build{background:var(--navy);border-color:var(--navy);border-top-color:var(--orange)}
.colcard.build h3{color:#fff} .colcard.build p{color:#c9d6e2}
.layout-ico{display:flex;gap:6px}
.layout-ico span{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:3px;background:var(--bg);color:var(--navy)}

.col-hero .wrap{padding-bottom:44px}
.col-title[contenteditable="true"]{outline:1.5px dashed rgba(255,255,255,.35);outline-offset:6px;border-radius:4px}
.col-title[contenteditable="true"]:focus{outline-color:var(--orange)}
.edit-hint{font-size:12px;color:#8fb3cf;margin-top:-6px;margin-bottom:12px}
.layoutbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:30}
.layoutbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:7px;overflow:hidden}
.seg button{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;color:var(--navy);border-right:1.5px solid var(--navy)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}

/* proof layout */
.proof{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 24px 22px;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pcard:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--sky),var(--blue))}
.pcard:nth-child(2n):after{background:linear-gradient(90deg,var(--orange),#ff8a4c)}
.pcard b.v{font-size:46px;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em}
.pcard .vl{font-size:14px;font-weight:600;color:var(--navy);margin-top:10px;line-height:1.4}
.pcard .who{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.pcard h3{font-size:16.5px;margin-top:10px}
.pcard p{font-size:14px;margin-top:8px}
.pcard .acts{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:16px}
.rm{font-size:12px;font-weight:800;color:var(--muted)}
.rm:hover{color:var(--orange)}

/* featured layout */
.feat{background:var(--navy);border-radius:var(--r);color:#fff;display:grid;grid-template-columns:1.35fr 1fr;gap:34px;padding:34px 36px;position:relative;overflow:hidden}
.feat:after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange)}
.feat h3{color:#fff;font-size:26px;margin-top:12px}
.feat p{color:#c9d6e2;margin-top:12px;font-size:15px;line-height:1.65}
.feat .fstats{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px;align-content:center}
.feat .fstats div{border-left:2px solid var(--sky);padding-left:14px}
.feat .fstats div:nth-child(2n){border-color:var(--orange)}
.feat .fstats b{display:block;font-size:30px;font-weight:800;color:#fff;line-height:1.05}
.feat .fstats span{display:block;font-size:12.5px;color:#a9bfd2;margin-top:6px;line-height:1.35}
.feat .btn{margin-top:20px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:18px}
.mini{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;background:#fff;box-shadow:var(--shadow);border-radius:var(--r);padding:16px 18px;text-align:left;border:1.5px solid transparent;transition:.15s}
.mini:hover{border-color:var(--sky);background:#fff}
.mini b{font-size:24px;overflow-wrap:anywhere;font-weight:800;color:var(--navy);line-height:1}
.mini small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mini h4{font-size:15px;margin-top:4px;line-height:1.3}
.mini .feature-btn{font-size:12px;font-weight:800;color:var(--blue);margin-top:6px;display:inline-block}

/* one-pager layout */
.op{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.op-h,.op-r{display:grid;grid-template-columns:52px 1.25fr 1.35fr 1fr 150px 34px;gap:18px;align-items:center;padding:14px 20px}
.op-h{background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.op-r{border-top:1px solid var(--line);background:#fff;text-align:left;width:100%;transition:.12s;font-size:14px}
.op-r:hover{background:var(--bg)}
.op-r .idx{font-weight:800;color:var(--orange);font-size:15px}
.op-r .t{font-weight:800;color:var(--ink);line-height:1.3}
.op-r .c{font-size:12.5px;color:var(--muted);margin-top:2px}
.op-r .ch{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.op-r .res b{display:block;font-size:22px;font-weight:800;color:var(--navy);line-height:1}
.op-r .res span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:3px}
.op-r .chev{font-size:18px;color:var(--navy);transition:transform .2s;text-align:center}
.op-r[aria-expanded="true"] .chev{transform:rotate(90deg)}
.op-x{display:none;background:var(--bg);padding:22px 20px 24px 90px;border-top:1px dashed var(--line)}
.op-x.open{display:block}
.op-x .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.op-x h5{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.op-x p{font-size:13.5px;line-height:1.6}
.op-x .more{margin-top:14px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(7,41,66,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:90;transform:translateX(100%);transition:transform .28s;overflow:auto;box-shadow:-20px 0 40px -20px rgba(7,41,66,.4)}
.drawer.show{transform:none}
.drawer .dh{background:var(--navy);color:#fff;padding:28px 32px 30px;position:relative}
.drawer .dh h2{color:#fff;font-size:26px;margin-top:12px}
.drawer .dh .x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-size:18px}
.drawer .db{padding:24px 32px 40px}
.drawer .stats{--n:3;gap:12px}
.drawer .stat{box-shadow:none;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.drawer .stat b{font-size:30px}
.drawer .stat p{font-size:13px}
.drawer .stack .blk{grid-template-columns:1fr;gap:8px}
.drawer .meta{grid-template-columns:1fr 1fr;gap:14px 0;margin-top:22px}

/* footer */
.sitefoot{background:var(--navy);color:#c9d6e2}
.sitefoot .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px;font-size:13px;flex-wrap:wrap}
.sitefoot b{color:#fff;letter-spacing:.14em;font-size:12px;margin-right:10px}
.sitefoot .r{display:flex;align-items:center;gap:14px}
.sitefoot .r a.site{color:var(--orange);font-weight:700}
.sitefoot .r .sep{opacity:.4}
.sitefoot .top{border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:5px 10px;font-weight:700;color:#fff;font-size:12px}
.sitefoot .talk{background:var(--orange);color:#fff;font-weight:800;padding:8px 14px;border-radius:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:7px;opacity:0;transition:.2s;z-index:120;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .wrap{padding:0 20px}
  .nav-hint{display:none}
  .hero-stats,.meta{grid-template-columns:1fr 1fr;row-gap:22px}
  .stats{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr}
  .step{border-right:0;border-bottom:1px solid var(--line)}
  .feat{grid-template-columns:1fr}
  .stack .blk{grid-template-columns:1fr;gap:8px}
  .op-h{display:none}
  .op-r{grid-template-columns:40px 1fr 30px;row-gap:8px}
  .op-r .ch,.op-r .svc{display:none}
  .op-r .res{grid-column:2}
  .op-x{padding-left:20px}.op-x .cols{grid-template-columns:1fr}
  .rings{display:none}
  .filterbar,.layoutbar{position:static}
  .topbar .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .search{min-width:0;flex:1 1 100%;margin-left:0}
}
@media (max-width:560px){ .tab{padding:7px 9px;font-size:10px} .stats{grid-template-columns:1fr} .brand img{height:30px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.stat{opacity:1;transform:none}}
.srcline{font-size:13px;color:#5d7088;margin:18px 0 0}.srcline a{color:inherit}
</style>
</head>

<script>
const CASES = [{"slide": 6, "title": "IT Integration and Support for Growth Strategy", "placement": null, "challenge": "A $700M top 25 U.S. CPA firm urgently needed an integration and deployment team to support its aggressive growth strategy of acquiring eight to ten accounting firms per year. Key objectives included transitioning to a shared services model, consolidating global offices, and adhering to location-based requirements. The scope spanned IT service management improvements, large-scale hardware deployments, continued deskside support, and seamless integration of newly acquired firms into the firm's Azure cloud environment.", "solution": "Vaco quickly partnered with the client and established a centralized team of consultants at the firm's headquarters to manage laptop provisioning across the East Coast. Vaco also led hardware deployments and office relocation efforts for locations in New York City, Long Island, Connecticut, New Jersey, North Carolina, and Florida. Over fifty consultants successfully supported the integration of seven acquired firms in a single year while maintaining consistent, high-quality customer service throughout the transition.", "impact": "By establishing a partnership rooted in trust, Vaco collaborated closely with the client to improve overall service quality throughout the acquisition integration process. These efforts increased employee retention and work efficiency while enabling the firm to continue delivering exceptional service to its own clients.", "industry": "Professional Services / CPA Firm", "services": "Staff Augmentation", "expertise": "IT Technical Support & Deskside Services", "location": "New York County, NY", "stats": [{"value": "150+", "label": "Consultants embedded to support integration and deployment"}, {"value": "+15%", "label": "Increase in customer satisfaction scores through improved technical assistance"}, {"value": "−20%", "label": "Reduction in support ticket volume via knowledge base and self-service"}, {"value": "Zero", "label": "Lost devices per year, down from 20–40, through standardized asset management"}], "quote": null, "id": 1, "client": "Top 25 U.S. CPA Firm", "industryGroup": "Professional Services", "primary": "IT Support & Deskside", "serviceGroup": "Staff Augmentation", "state": "New York", "headline": "Seven acquired firms integrated in one year with zero lost devices.", "tags": ["IT Support & Deskside"]}, {"slide": 7, "title": "Driving Portfolio Value Creation Through Data Intelligence & AI", "placement": null, "challenge": "A mid-market PE firm with a diverse portfolio spanning services, distribution, and technology-enabled businesses was unable to unlock the full value of its operating companies’ data. Fragmented systems, inconsistent reporting, and no centralized data or AI strategy meant deal teams and portfolio leadership lacked the visibility needed to identify margin improvements, optimize operations, and make faster, higher-conviction decisions. Without dedicated leadership and engineering talent at the portfolio company level, data remained an untapped value creation lever.", "solution": "Vaco placed Data Intelligence and AI leaders directly into portfolio companies to define strategy, build roadmaps, and drive execution tied to each company’s value creation plan. Under those leaders, Vaco is building out the entire data and business intelligence engineering team — standing up reporting, KPI dashboards, and analytics that give C-suite and deal teams real-time visibility into revenue drivers, cost structures, and operational performance. In parallel, these leaders are driving AI adoption across the portfolio, identifying high-impact use cases and embedding AI-driven automation and insights into day-to-day operations.", "impact": "Portfolio companies now operate with decision-ready data platforms that directly support value creation plans, operational improvements, and executive reporting. Deal teams and C-suite leaders have consistent, timely visibility into the metrics that drive returns — from revenue and margin to utilization and cost efficiency. AI adoption is accelerating across the portfolio, with leaders identifying and deploying use cases that reduce manual work, improve forecasting, and surface insights that were previously invisible. The model is designed to scale across future acquisitions, compressing time-to-value at each new platform.", "industry": "Private Equity", "services": "Direct Hire & Executive Search", "expertise": "Data Intelligence, BI & AI", "location": "New York County, NY", "stats": [{"value": "Lead", "label": "Data & AI leaders embedded in portfolio companies to drive value creation"}, {"value": "Build", "label": "Full BI & engineering teams delivering KPI reporting and operational visibility"}, {"value": "Adopt", "label": "AI adoption driving automation, forecasting, and insights across the portfolio"}], "quote": null, "id": 2, "client": "Mid-Market Private Equity Firm", "industryGroup": "Private Equity", "primary": "Data & Analytics", "serviceGroup": "Executive Search", "state": "New York", "headline": "Data and AI leaders embedded across portfolio companies to drive value creation.", "tags": ["AI & Machine Learning", "Data & Analytics", "Technology Leadership"]}, {"slide": 8, "title": "End-to-End Digital Transformation & IT Department Buildout", "placement": null, "challenge": "A PE-backed energy services organization had no internal IT department, no technology leadership, and no modern infrastructure. Operations ran on an aging IFS/BOLO ERP, fully on-prem servers, legacy networking, and zero enterprise security, data, or application capabilities. With rapid organic growth and an aggressive M&A strategy, the company needed to build an entire IT organization from scratch and modernize every layer of its technology stack simultaneously.", "solution": "The company's newly appointed CIO engaged Vaco to execute a wall-to-wall digital transformation, embedding 20+ resources dictive models, enabling leadership to shift from reactive decision‑making to data‑informed strategy across all business lines.", "industry": "Software & SaaS", "services": "Executive Search", "expertise": "Data & Analytics", "location": "Monmouth County, NJ", "stats": [{"value": "Hire", "label": "Director of Data Analytics placed to lead strategy and full team buildout"}, {"value": "Scale", "label": "Migrated legacy reporting to scalable cloud data warehouse with predictive analytics"}, {"value": "Unified", "label": "Enterprise-wide visibility through standardized dashboards across all business lines"}], "quote": null, "id": 7, "client": "Benefits Administration & Enrollment Platform", "industryGroup": "Software & SaaS", "primary": "Data & Analytics", "serviceGroup": "Executive Search", "state": "New Jersey", "headline": "A full data and analytics function stood up, starting with its first data leader.", "tags": ["Data & Analytics", "Technology Leadership"]}, {"slide": 13, "title": "Infrastructure Leadership for Multi-Site Growth", "placement": null, "challenge": "The organization lacked a dedicated infrastructure leader, resulting in fragmented ownership across networking, infrastructure, and IT operations. The VP of IT was overextended, balancing application leadership with hands-on infrastructure support, including server maintenance, site outages, and vendor coordination. Upcoming acquisitions and a growing multi-site footprint (nearly 40 locations) increased complexity, while reliance on external vendors and inconsistent standards created risk to uptime, scalability, and long-term strategy.", "solution": "Vaco delivered a hands-on Director of IT Networking and Infrastructure with deep expertise in cloud platforms, enterprise networking, and infrastructure modernization. The selected candidate brought experience in Azure, AWS, Microsoft 365, and multi-site network environments, along with a proven ability to standardize infrastructure, lead cloud migrations, and manage vendor relationships. With a balance of strategic leadership and technical execution, the candidate was well-positioned to take full ownership of infrastructure operations, improve governance, and support a scalable IT model.", "impact": "Established dedicated ownership of infrastructure, networking, and IT operations. Reduced dependency on overextended internal leadership and external vendors. Improved standardization and reliability across a multi-site environment. Created a scalable foundation for cloud migration, acquisitions, and long-term growth.", "industry": "Manufacturing", "services": "Executive Search", "expertise": "Cloud & Infrastructure, Technology Leadership", "location": "New Haven County, CT", "stats": [{"value": "40", "label": "Locations supported with dedicated infrastructure, networking, and IT operations ownership"}, {"value": "Direct", "label": "Reduced dependency on overextended internal leadership and external vendors"}, {"value": "Cloud", "label": "Azure, AWS, and M365 standardization improving reliability across all sites"}], "quote": null, "id": 8, "client": "Multi-Site Manufacturer", "industryGroup": "Manufacturing", "primary": "Cloud & Infrastructure", "serviceGroup": "Executive Search", "state": "Connecticut", "headline": "A dedicated infrastructure leader for nearly 40 locations and an active acquisition pipeline.", "tags": ["Cloud & Infrastructure", "Technology Leadership"]}, {"slide": 14, "title": "Data Analytics Leadership for Enterprise Insight & Growth", "placement": null, "challenge": "The organization lacked centralized data leadership and needed a senior analytics executive to drive strategy, build a high-performing team, and modernize its data environment. Fragmented reporting, increasing demand for real-time insights, and the need to integrate multiple data sources created complexity. The role required balancing hands-on technical expertise with strategic leadership while enabling executive stakeholders to leverage data for business decisions.", "solution": "Vaco by Highspring identified and delivered a Director of Data Analytics with a strong combination of technical expertise and leadership experience. The selected candidate brought deep knowledge of data mining, statistical analysis, and machine learning, along with proficiency in Python, SQL, and cloud-based analytics platforms including ADW. With experience managing analytics teams and implementing scalable processes, the candidate was equipped to establish structure, improve data accessibility, and align analytics with business objectives.", "impact": "Appointed a Director-level leader to establish and scale the data analytics function. Improved alignment between business stakeholders and data teams. Enabled more effective translation of complex data into executive-level insights. Created a foundation for scalable analytics, reporting, and data-driven decision-making.", "industry": "Software & SaaS", "services": "Executive Search", "expertise": "Data & Analytics, Technology Leadership", "location": "Monmouth County, NJ", "stats": [{"value": "Placed", "label": "Director of Data Analytics with Python, SQL, and cloud analytics expertise"}, {"value": "Align", "label": "Aligned business stakeholders and data teams for executive-level insight delivery"}, {"value": "Scale", "label": "Foundation for scalable analytics, reporting, and data-driven decisions"}], "quote": null, "id": 9, "client": "Benefits Technology Company", "industryGroup": "Software & SaaS", "primary": "Data & Analytics", "serviceGroup": "Executive Search", "state": "New Jersey", "headline": "A hands-on analytics executive placed to unify reporting and modernize the data stack.", "tags": ["Data & Analytics", "Technology Leadership"]}, {"slide": 15, "title": "Unifying IT & Systems Integration Across a PE Portfolio", "placement": null, "challenge": "A PE-backed, multi-site organization spanning manufacturing and guest-facing operations across California, Pennsylvania, Tennessee, and New York operated with fragmented ERP, CRM, data, and cybersecurity systems. The lack of standardization limited operational visibility, scalability, and compliance readiness. The company needed a Director-level technology leader to architect a unified IT and systems integration platform supporting ongoing M&A activity, data governance, and long-term business growth in close partnership with private equity stakeholders.", "solution": "Highspring identified a Director of IT & Systems Integration with over a decade of progressive leadership across enterprise systems, cybersecurity, and multi-site operations. The selected candidate brought deep hands-on expertise in ERP and CRM platforms, cloud-native architectures, and API-driven integrations, paired with a proven track record in high-volume, customer-facing industries and PE-backed environments. This leader was positioned to standardize platforms, build scalable data warehouse and reporting solutions, and establish robust cybersecurity governance across all business units.", "impact": "Established a unified IT strategy and systems integration roadmap across all U.S. sites. Standardized ERP, CRM, and reporting platforms to deliver cross-entity visibility for executive decision-makers. Implemented scalable cybersecurity policies and data governance frameworks supporting compliance and M&A readiness. Built a technology foundation enabling operational independence for each business unit while driving portfolio-wide growth.", "industry": "Private Equity / Manufacturing", "services": "Executive Search", "expertise": "IT Strategy, Systems Integration, Enterprise Applications", "location": "Multi-Site (CA, PA, TN, NY)", "stats": [{"value": "Unify", "label": "Unified IT strategy and systems integration across four U.S. sites"}, {"value": "Integrate", "label": "Standardized ERP, CRM, and data platforms for cross-entity visibility"}, {"value": "Govern", "label": "Cybersecurity and data governance frameworks supporting M&A and compliance"}], "quote": null, "id": 10, "client": "PE-Backed Multi-Site Portfolio Company", "industryGroup": "Private Equity", "primary": "Enterprise Applications", "serviceGroup": "Executive Search", "state": "Multi-State", "headline": "One IT and systems platform unifying four sites across CA, PA, TN, and NY.", "tags": ["Enterprise Applications", "Technology Leadership"]}, {"slide": 16, "title": "Building a Full-Scale ServiceNow Practice for a Fortune 500 AEC Firm", "placement": null, "challenge": "A multi-billion-dollar construction services division of a Fortune 500 engineering and construction group needed to stand up an entire ServiceNow practice from scratch. With 30+ operating companies running disparate ITSM tools and no centralized configuration management, the organization lacked the platform expertise to drive CMDB implementation, IT asset management, and service catalog standardization enterprise-wide. They needed a complete team—from a Director of ServiceNow to hands-on CMDB Engineers - to build, configure, and operationalize the platform across a highly decentralized environment.", "solution": "Highspring built out the entire ServiceNow team for the client’s construction vertical through a combination of Executive Search and Direct Hire. At the leadership level, Highspring placed a Director of ServiceNow responsible for platform strategy, vendor management, and cross-functional coordination across operating companies. Beneath the Director, Highspring sourced and placed ServiceNow Architects, Developers, and CMDB Engineers to handle platform configuration, CMDB design and population, discovery tool integration, IT asset management workflows, and service catalog buildout. Each hire was evaluated for deep ServiceNow platform expertise, ITIL knowledge, and the ability to operate across a complex, decentralized enterprise.", "impact": "Stood up a fully operational ServiceNow practice from the ground up, delivering a complete team spanning headline": "An underwriting delivery leader placed to raise Agile maturity and delivery trust.", "tags": ["Digital Transformation", "Program & Delivery Leadership", "Technology Leadership"]}, {"slide": 20, "title": "Building Enterprise IT for a PE-Backed Commercial Services Platform", "placement": null, "challenge": "A PE-backed national commercial services platform was scaling rapidly through acquisitions and needed to professionalize and centralize IT across a fragmented portfolio of operating companies. The environment lacked standardization across ERP, CRM, infrastructure, and collaboration tools, creating risk around scalability, governance, reporting, and acquisition readiness.", "solution": "Highspring partnered with the client to build the enterprise IT function from the ground up, placing a Head of IT with the mandate and authority to establish centralized IT governance across acquired companies, own and standardize core enterprise systems (Sage Intacct, BuildOps, Azure, Microsoft 365), support Day 1 and post-close integration for new acquisitions, and create a scalable platform to enable future growth and M&A velocity. The engagement also encompassed enterprise reporting, analytics strategy, vendor management, and IT security and controls.", "impact": "Built a true enterprise IT backbone supporting a PE-backed buy-and-build strategy. Enabled consistent systems, reporting, and controls across operating companies. Improved acquisition readiness and scalability for future M&A. Established IT as a value-creation function rather than a reactive support layer.", "industry": "Business Services / Professional Services", "services": "Executive Search", "expertise": "IT Transformation & Buildout, M&A Technology Advisory", "location": "Northeast (Multi-Site)", "stats": [{"value": "Central", "label": "Centralized IT governance, reporting, and controls across all acquired companies"}, {"value": "Unified", "label": "Sage Intacct, BuildOps, Azure, and M365 standardized e s, standards, and governance. Modernized IT operations and infrastructure to support scalable, innovative, and compliant technology solutions. Positioned the company for continued growth through strategic vendor management and technology-driven operational improvements.", "industry": "Entertainment / Attractions", "services": "Executive Search", "expertise": "Cybersecurity, IT Strategy, Technology Leadership", "location": "New York County, NY", "stats": [{"value": "Strategy", "label": "Enterprise IT and cybersecurity roadmap aligned with corporate goals"}, {"value": "Protect", "label": "Comprehensive cybersecurity policies, standards, and governance established"}, {"value": "Innovate", "label": "Scalable infrastructure and technology-driven innovation supporting business growth"}], "quote": null, "id": 16, "client": "Premier NYC Attractions Company", "industryGroup": "Entertainment & Hospitality", "primary": "Cybersecurity", "serviceGroup": "Executive Search", "state": "New York", "headline": "A VP of IT & Cybersecurity placed to own strategy and security in a guest-facing business.", "tags": ["Cybersecurity", "Technology Leadership"]}, {"slide": 22, "title": "Establishing an Enterprise AI & Automation Leader for a Global Organization", "placement": null, "challenge": "A large, globally distributed organization was investing heavily in automation, analytics, and emerging AI technologies, but lacked centralized leadership to unify these efforts. AI initiatives were spread across functions, leading to inconsistent standards, unclear ROI, and limited enterprise visibility. Leadership needed a senior AI leader to centralize strategy, delivery, and governance across business operations.", "solution": "Vaco partnered with leadership to conduct a Director-level AI and Automation search focused on enterprise scale. The role was chartered to lead AI, ML, and intelligent automation initiatives across shared services, embed AI into core operational functions, and establish governance, intake, and prioritization frameworks. The engagement prioritized leaders with experience delivering AI at scale within complex enterprise environments, ensuring alignment between technology, operations, and executive stakeholders.", "impact": "Delivered an AI & Automation Director who unified fragmented initiatives into a centralized, enterprise-wide AI program. The organization improved visibility into AI investments, accelerated adoption across business functions, and established a sustainable model for scaling AI globally.", "industry": "Manufacturing", "services": "Executive Search", "expertise": "Artificial Intelligence & Machine Learning, Technology Leadership", "location": "New Haven County, CT", "stats": [{"value": "Unified", "label": "Fragmented AI initiatives unified under centralized enterprise-wide leadership"}, {"value": "Govern", "label": "Governance, intake, and prioritization frameworks established for AI investments"}, {"value": "Global", "label": "Sustainable model for scaling AI adoption across global business functions"}], "quote": null, "id": 17, "client": "Global Manufacturing Organization", "industryGroup": "Manufacturing", "primary": "AI & Machine Learning", "serviceGroup": "Executive Search", "state": "Connecticut", "headline": "A Director of AI & Automation placed to unify scattered AI efforts under one strategy.", "tags": ["AI & Machine Learning", "Technology Leadership"]}, {"slide": 23, "title": "Building an Enterprise AI & Data Function for a PE-Backed Energy Services Platform", "placement": null, "challenge": "A PE-backed energy services platform identified AI and advanced analytics as critical value-creation levers, but had no internal capability to execute. Data efforts were fragmented, AI initiatives were outsourced, and the organization lacked the leadership, engineering talent, and governance framework to scale AI alongside an aggressive M&A growth strategy. They needed a partner to build a complete AI and data function from scratch—spanning executive leadership through hands-on engineering.", "solution": "Highspring executed a multi-phase engagement combining direct hire and staff augmentation to stand up the entire AI and data organization. We placed senior AI and data leadership through executive search, then built out the supporting team—data engineers, ML engineers, analytics leads, and AI specialists—through staff augmentation. The function was architected to deliver enterprise reporting, predictive analytics, AI-enabled decisioning, and GenAI initiatives, all underpinned by proper data governance, security protocols, and scalability aligned to PE growth objectives.", "impact": "Delivered a fully operational AI and data function that eliminated third-party dependency, accelerated insight delivery, and embedded AI-driven decision-making across the enterprise. The organization now runs predictive analytics, ML models, and GenAI capabilities in-house—driving margin improvement, operational efficiency, and long-term value creation as a core internal capability rather than a bolt-on initiative.", "industry": "Energy & Utilities", "services": "Direct Hire & Staff Augmentation", "expertise": "Artificial Intelligence & Machine Learning, Data & Analytics", "location": "New York County, NY; Harris County, TX", "stats": [{"value": "AI Team", "label": "Full AI & data function built from leadership through engineering via direct hire and staff aug"}, {"value": "ML & AI", "label": "Predictive analytics, ML models, and GenAI capabilities deployed in-house"}, {"value": "Scale", "label": "Eliminated third-party dependency; AI now drives margin improvement and PE value creation"}], "quote": null, "id": 18, "client": "PE-Backed Energy Services Platform", "industryGroup": "Energy & Utilities", "primary": "AI & Machine Learning", "serviceGroup": "Staff Augmentation", "state": "New York", "headline": "A complete AI and data function built, from leadership to hands-on engineers.", "tags": ["AI & Machine Learning", "Data & Analytics"]}, {"slide": 24, "title": "Building an Enterprise AI Function for a Mid-Market Technology Company", "placement": null, "challenge": "A growing technology company reached a point where AI and automation initiatives had outgrown traditional BI and analytics ownership. AI efforts were fragmented across teams, lacked governance, and were being approached tactically rather than strategically. Leadership made a deliberate decision to separate AI into its own dedicated function to ensure enterprise alignment, accountability, and business-led use-case development. The organization needed a senior leader who could stand up AI as a core capability—balancing machine learning, GenAI, and automation - while ensuring responsible adoption and measurable business impact.", "solution": "Highspring partnered with the organization to lead a Director of AI search, focused on identifying a leader capable of building the AI function from the ground up. The role was designed to define AI strategy, establish governance, determine where AI versus traditional automation created the most value, and partner closely with IT and business leaders to operationalize AI across the enterprise. The search emphasized operators with hands-on experience embedding AI into real business workflows rather than research-only or consulting-only profiles.", "impact": "Successfully delivered a Director of AI and established a formal AI and automation function. The organization gained clear ownership, governance, and prioritization for AI initiatives, positioning AI as a scalable enterprise capability aligned to business outcomes rather than isolated experimentation.", "industry": "Software & SaaS", "services": "Executive Search", "expertise": "Artificial Intelligence & Machine Learning", "location": "Suffolk County, MA", "stats": [{"value": "Own", "label": "AI strategy defined and separated from traditional BI into dedicated function"}, {"value": "Govern", "label": "Governance, accountability, and enterprise alignment established for all AI initiatives"}, {"value": "Impact", "label": "AI embedded into real business workflows delivering measurable business impact"}], "quote": null, "id": 19, "client": "Mid-Market Technology Company", "industryGroup": "Software & SaaS", "primary": "AI & Machine Learning", "serviceGroup": "Executive Search", "state": "Massachusetts", "headline": "AI separated from BI into its own function, with governance and real workflow impact.", "tags": ["AI & Machine Learning", "Technology Leadership"]}, {"slide": 26, "title": "Strengthening Healthcare Security Through Strategic CISO Placement", "placement": "CISO / SVP of Information Security, Compliance and IT", "challenge": "A healthcare technology company needed a senior security leader to own enterprise risk posture, protect sensitive client data and member health information, and drive compliance maturity across HITRUST and SOC 2 certifications. The organization was evolving its cloud infrastructure on AWS and needed someone who could align security strategy with business objectives while supporting a fully remote workforce. The role required a leader spanning cybersecurity, IT operations, cloud infrastructure, and regulatory compliance.", "solution": "Vaco identified and secured a VP of Information Security, Compliance & IT - a seasoned leader with 20+ years of progressive experience across cybersecurity, cloud operations, DevOps, and enterprise IT. The candidate brought a track record of building and scaling security programs, maintaining SOC 2 and HITRUST certifications, securing remote workforces, and leading technology integrations through multiple acquisitions. Their pragmatic, risk-based approach balanced strong protection with operational efficiency.", "impact": "Strengthened the organization’s security posture and compliance framework, maintaining HITRUST and SOC 2 certifications while advancing compliance automation through AI. Built high-performing teams across security, IT, cloud, and compliance. The candidate was subsequently promoted to CISO/SVP, validating the strategic impact of the placement.", "industry": "Healthcare", "services": "Executive Search", "expertise": "Cybersecurity, Technology Leadership", "location": "New Haven County, CT", "stats": [{"value": "20+", "label": "Years of progressive cybersecurity experience protecting client health data"}, {"value": "SOC 2", "label": "HITRUST and SOC 2 certifications maintained with AI-driven compliance automation"}, {"value": "CISO", "label": "Candidate promoted to CISO/SVP after building high-performing security teams"}], "quote": null, "id": 21, "client": "Healthcare Technology Company", "industryGroup": "Healthcare", "primary": "Cybersecurity", "serviceGroup": "Executive Search", "state": "Connecticut", "headline": "A security executive placed, then promoted to CISO/SVP, keeping HITRUST and SOC 2 intact.", "tags": ["Cybersecurity", "Technology Leadership"]}, {"slide": 27, "title": "Building a Security Leadership Function for a Fortune 500 AEC Firm", "placement": "VP of Security · Reports to CISO", "challenge": "A multi-billion-dollar construction services division of a Fortune 500 engineering and construction group, operating across dozens of entities and thousands of employees, needed a VP of Security reporting directly to the CISO to build and lead the enterprise security function. With operations spanning 30+ locations, growing cyber risk exposure from M&A activity, and increasing regulatory scrutiny around federal and industry compliance standards, the organization required a seasoned security leader to establish governance, drive risk mitigation, and protect critical infrastructure at scale.", "solution": "Vaco delivered a VP of Security reporting to the CISO, bringing 20+ years of progressive cybersecurity leadership across enterprise environments. This leader brought deep expertise in security architecture, incident response, vulnerability management, and compliance frameworks (NIST, ISO 27001, CMMC) within complex, decentralized operations. The placement also brought proven experience building security teams from the ground up, establishing SOC capabilities, implementing zero-trust architecture, and aligning security strategy with business objectives across multiple operating companies and post-acquisition environments.", "impact": "Established a centralized security function across the client’s construction vertical, bringing governance and visibility to a previously fragmented security landscape. Reduced mean time to detect and respond to threats by over 60% through SOC buildout and SIEM implementation. Achieved compliance readiness across NIST 800-171 and CMMC frameworks, enabling the organization to pursue federal contracts with confidence while supporting continued M&A integration.", "industry": "Architecture, Engineering & Construction (AEC)", "services": "Executive Search", "expertise": "Cybersecurity, Technology Leadership", "location": "Northeast U.S.", "stats": [{"value": "20+", "label": "Years of cybersecurity leadership delivered as VP of Security reporting to the CISO"}, {"value": "NIST", "label": "NIST 800-171 and CMMC compliance readiness achieved across the enterprise"}, {"value": "−60%", "label": "Reduction in mean time to detect and respond to threats through SOC and SIEM buildout"}], "quote": null, "id": 22, "client": "Fortune 500 Construction Services Division", "industryGroup": "AEC", "primary": "Cybersecurity", "serviceGroup": "Executive Search", "state": "Northeast (Multi-Site)", "headline": "A VP of Security placed who cut threat detection and response time by over 60%.", "tags": ["Cybersecurity", "Technology Leadership"]}, {"slide": 28, "title": "Dynamics GP Stabilization & Financial Operations", "placement": null, "challenge": "After migrating Dynamics GP to the cloud and introducing Analytical Accounting for fund tracking, the university's finance team struggled to operate within the New York City headquarters needed to execute a large-scale endpoint refresh spanning hundreds of employee workstations and laptops. The project carried a fixed delivery window, leaving little room for delays or extended downtime. Aging hardware and inconsistent device configurations were creating security vulnerabilities and productivity bottlenecks, while the internal IT team lacked the bandwidth to manage a rollout of this scale without disrupting day-to-day operations. Maintaining a seamless user experience throughout the transition was critical given the firm’s client-facing environment.", "solution": "Vaco embedded a team of dedicated, on-site technical resources at the firm’s NYC headquarters to lead device imaging, configuration, and deployment across all affected workstations. The team managed end-to-end logistics including data migration, application re-installation, peripheral setup, and secure retirement of legacy hardware in compliance with corporate data policies. Vaco coordinated closely with internal IT leadership to establish a phased rollout schedule that minimized disruption floor by floor, providing white-glove support to end users during the transition and ensuring each workstation was validated before handoff.", "impact": "The full endpoint refresh was completed on schedule with zero missed deadlines, delivering updated, standardized hardware across the entire headquarters. End users experienced minimal downtime thanks to the phased rollout approach, and the firm saw immediate improvements in device performance, security posture, and IT support ticket volume. Legacy equipment was securely decommissioned, and the internal IT team gained a repeatable playbook for future refresh cycles.", "industry": "Business Services / Professional Services", "services": "Staff Augmentation", "expertise": "IT Technical Support & Deskside Services", "location": "New York County, NY", "stats": [{"value": "100%", "label": "Endpoint refresh completed on schedule with zero missed milestones"}, {"value": "Zero", "label": "Downtime through phased floor-by-floor rollout with white-glove user support"}, {"value": "Secure", "label": "Legacy hardware securely decommissioned with repeatable playbook for future cycles"}], "quote": null, "id": 24, "client": "Top 25 U.S. CPA Firm", "industryGroup": "Professional Services", "primary": "IT Support & Deskside", "serviceGroup": "Managed Services", "state": "New York", "headline": "A floor-by-floor endpoint refresh finished on schedule with zero downtime.", "tags": ["IT Support & Deskside"]}, {"slide": 31, "title": "Securing Cloud Infrastructure & Governance for a Global Beauty Corporation", "placement": "VP of Information Security · Reports to CIO", "challenge": "A global beauty corporation needed a VP of Information Security to own governance, compliance, and the full security ecosystem across its Americas region. The previous leader had departed abruptly, leaving critical projects incomplete - including a CyberArk Privileged Access rollout and PCI compliance for retail POS operations. With a complex Azure cloud environment, outsourced security operations, and global coordination with headquarters in Tokyo, the organization required a hands-on security architect to drive remediation and connect regional strategy to a global framework.", "solution": "Highspring secured a VP of Information Security with 10+ years of progressive experience in enterprise security operations and Azure cloud architecture. The placement brought deep expertise across AzureAD, M365, InTune, and SharePoint security, along with proven PCI/PII compliance leadership and hands-on vulnerability management, penetration testing, and phishing exercises. This leader had a track record of bridging outsourced SOC operations with internal remediation - translating vendor findings into actionable improvements while serving as the organization’s security architect.", "impact": "Completed the CyberArk Privileged Access rollout within 90 days, closing a critical identity governance gap. Standardized security strategies across the Americas region and strengthened PCI compliance for retail operations spanning multiple locations. Established a unified governance framework connecting regional security with global headquarters, improving incident response coordination and regulatory readiness enterprise-wide.", "industry": "Retail, CPG, Commerce", "services": "Executive Search", "expertise": "Cybersecurity, Cloud & Infrastructure", "location": "Northeast U.S.", "stats": [{"value": "PCI", "label": "PCI/PII compliance framework established with unified security governance across the Americas"}, {"value": "90", "label": "Days to complete CyberArk Privileged Access rollout and Azure cloud security hardening"}, {"value": "Unified", "label": "Security strategy standardized connecting regional operations with global headquarters"}], "quote": null, "id": 25, "client": "Global Beauty Corporation", "industryGroup": "Retail & CPG", "primary": "Cybersecurity", "serviceGroup": "Executive Search", "state": "Northeast (Multi-Site)", "headline": "A VP of Information Security placed who finished a stalled CyberArk rollout in 90 days.", "tags": ["Cloud & Infrastructure", "Cybersecurity", "Technology Leadership"]}, {"slide": 32, "title": "UKG Workforce Management Implementation & HRIS Integration", "placement": null, "challenge": "A leading health system was undertaking a major UKG Workforce Management capital project requiring deep functional expertise in timekeeping, advanced scheduling, and HRIS integration. The scope demanded a senior analyst who could bridge complex WFM configuration with IT governance, documentation standards, and cross-system integration across HRIS, Payroll, and downstream applications- a rare skill set in the healthcare WFM space.", "solution": "Vaco placed a Senior UKG Consultant with direct Dimensions experience in timekeeping rules, pay policies, and Advanced Scheduler configuration. Embedded in the UKG Capital Project team, the resource led implementation activities, translated business requirements into functional specifications, and established documentation and governance standards across the WFM program - including integration validation across HRIS and Payroll systems to ensure end-to-end data flow integrity.", "impact": "Strengthened HRIS integration governance and accelerated UKG WFM implementation timelines. The resource owned both configuration and documentation workstreams, enabling audit-ready processes, cleaner data flows between HRIS and Payroll, and reduced risk during system rollout across multiple facilities.", "industry": "Healthcare", "services": "Staff Augmentation", "expertise": "HRIS, Workforce Management", "location": "Monmouth County, NJ", "stats": [{"value": "Faster", "label": "Accelerated UKG rollout timeline by consolidating configuration and governance under one resource"}, {"value": "Cleaner", "label": "Reduced payroll errors and exceptions through validated HRIS-to-Payroll data flows"}, {"value": "Lower Risk", "label": "Audit-ready documentation and governance reduced compliance exposure across multi-facility rollout"}], "quote": null, "id": 26, "client": "Leading Health System", "industryGroup": "Healthcare", "primary": "Enterprise Applications", "serviceGroup": "Staff Augmentation", "state": "New Jersey", "headline": "A senior UKG analyst who sped up the WFM rollout and cleaned up HRIS-to-payroll data.", "tags": ["Enterprise Applications"]}, {"slide": 33, "title": "Stabilizing IT Operations While Building Toward a Mature, Scalable Organization", "placement": null, "challenge": "A major hospitality company operated a lean IT organization undergoing transformation across Azure and ServiceNow environments. The team faced limited governance, documentation, and standardized processes, with fragmented ownership across security, infrastructure, and IT operations. Unexpected departures created execution risk across active initiatives, threatening momentum during a critical transformation window.", "solution": "Vaco deployed IT Project Management support to backfill a sudden leadership gap, coordinating infrastructure and software initiatives across a vendor-heavy environment while maintaining continuity during hiring. The team built a continuous candidate pipeline across security architecture, IT governance and compliance, infrastructure, and ServiceNow/ITSM roles. Vaco also identified organization-wide gaps in documentation, SOPs, and governance structure, positioning technical writer resources and a consulting-led framework build to move the client toward enterprise-grade IT operations.", "impact": "Stabilized IT delivery during unexpected leadership transitions, enabling continued execution across active infrastructure and security initiatives. Built a sustained talent pipeline across four critical workstreams. Positioned long-term transformation through an enterprise governance and documentation framework. Successful placements reinforced client trust and expanded the engagement scope.", "industry": "Entertainment / Attractions", "services": "Staff Augmentation", "expertise": "IT Transformation & Buildout, Cloud & Infrastructure", "location": "New York County, NY", "stats": [{"value": "Stable", "label": "IT delivery maintained through interim PM leadership during critical transitions"}, {"value": "4", "label": "Active workstreams supported across security, infrastructure, ITSM, and governance"}, {"value": "Govern", "label": "Enterprise-grade documentation, SOPs, and governance framework initiated"}], "quote": null, "id": 27, "client": "Major Hospitality Company", "industryGroup": "Entertainment & Hospitality", "primary": "IT Transformation & Buildout", "serviceGroup": "Staff Augmentation", "state": "New York", "headline": "IT delivery kept moving through sudden leadership gaps while governance was built.", "tags": ["Cloud & Infrastructure", "IT Transformation & Buildout"]}, {"slide": 29, "title": "Legacy Platform Stabilization & Digital Transformation", "placement": null, "challenge": "A global professional services firm relied on a legacy platform that was highly customized and not fully integrated across the organization. Support was handled primarily by a third-party agency, but leadership lacked confidence in the depth of expertise, level of detail, and sustained effort needed to drive meaningful progress. As a result, the platform lacked stability and internal stakeholders had limited visibility and control.", "solution": "Vaco partnered with internal digital transformation leadership to reassess the support model and embed the right long-term expertise. Two experienced full-time resources were added to the team, bringing both strong technical capability and a clear understanding of business objectives. The team supported agile sprint planning and execution, platform configuration and deployment, peer reviews, and structured knowledge transfer to internal stakeholders.", "impact": "Improved stability of a critical legacy platform and reduced reliance on third-party vendors. Achieved stronger alignment between technical delivery and business goals with clearer communication between technical teams and business leadership.", "industry": "Business Services / Professional Services", "services": "Consulting/Advisory", "expertise": "Digital Transformation, Software Engineering", "location": "Remote", "stats": [{"value": "Stable", "label": "Critical legacy platform stabilized with reduced third-party vendor reliance"}, {"value": "Agile", "label": "Agile sprint planning and execution aligned technical delivery with business goals"}, {"value": "Transfer", "label": "Structured knowledge transfer giving internal stakeholders visibility and control"}], "quote": null, "id": 28, "client": "Global Professional Services Firm", "industryGroup": "Professional Services", "primary": "Digital Transformation", "serviceGroup": "Consulting / Advisory", "state": "Remote", "headline": "A critical legacy platform stabilized and brought back under internal control.", "tags": ["Digital Transformation", "Software Engineering"]}, {"title": "Oracle Fusion ERP Implementation Support for a Defense Technology Company", "client": "Defense Technology Company", "industry": "Defense Technology", "industryGroup": "Defense & Aerospace", "services": "Staff Augmentation · Contract Staffing", "serviceGroup": "Staff Augmentation", "expertise": "ERP Implementation Support (Oracle Fusion)", "location": "Not disclosed", "state": "Not disclosed", "primary": "Enterprise Applications", "tags": ["Enterprise Applications"], "challenge": "A defense technology company faced significant challenges during its ERP migration. The project needed a highly skilled finance team to manage data, ensure compliance with ASC 606 revenue recognition standards and perform thorough contract reviews, work that required SQL, advanced Excel and prior ERP implementation experience. Separately, its technical accounting and hardware design teams faced critical resource shortages. After struggling to find a vendor that could fill these gaps, the company needed a partner who could quickly source high-performing talent for both its technology and finance functions.", "solution": "Vaco stepped in as a trusted partner, providing tailored support across financial planning and analysis, technical accounting and hardware design. The team connected the client with talent to manage data migrations, support the Oracle Fusion ERP implementation, address revenue recognition and contract reviews, and build a culture of efficiency in a fast-paced environment. The ongoing partnership includes performance tracking for newly onboarded talent and fast responses to urgent requests as bandwidth needs change.", "impact": "The partnership helped the client move its ERP implementation forward while keeping momentum across multiple initiatives. Vaco filled critical resource gaps quickly, scaling support where it was needed most across technology and finance: one cost consultant for a full year, six consultants for the technical accounting team, four for the FP&A team, added headcount for the Oracle Fusion ERP go-live, and AP and AR consultants to support rapid growth.", "stats": [{"value": "6", "label": "Consultants supporting the technical accounting team"}, {"value": "4", "label": "Consultants supporting financial planning and analysis"}, {"value": "Go-live", "label": "Added headcount for the Oracle Fusion ERP go-live"}], "headline": "Specialized technology and finance talent kept an Oracle Fusion ERP implementation moving.", "quote": null, "placement": null, "statsDerived": null, "source": "https://www.vaco.com/resources/case-studies/defense-tech-company-erp-implementation/", "published": "2026-03-27", "id": 29, "slide": null}, {"title": "Scaling Technology Talent Through an HQ Relocation & Digital Transformation", "client": "Leading Wealth Management Organization", "industry": "Wealth Management", "industryGroup": "Financial Services", "services": "Direct Hire · Contract Staffing", "serviceGroup": "Direct Hire", "expertise": "Technology Hiring for Enterprise Transformation", "location": "Not disclosed", "state": "Not disclosed", "primary": "Digital Transformation", "tags": ["Digital Transformation"], "challenge": "A leading wealth management organization was relocating its headquarters while running a large-scale digital transformation. It needed to scale hiring quickly across technology and operations in a competitive talent market, while easing the load on its internal HR and talent acquisition teams during a critical period of growth and change.", "solution": "Vaco partnered with the organization from the earliest stages of the relocation, delivering a streamlined, relationship-driven hiring strategy across technology, finance and operations. As needs evolved, the partnership expanded to more teams, markets and business units, with Vaco acting as an extension of the client's business: providing highly vetted talent, simplifying hiring and helping the organization scale with confidence.", "impact": "Vaco filled 25+ critical roles across technology, accounting and finance, and HR and operations, and supported a large-scale IT growth initiative tied to the enterprise transformation. Hiring friction and the burden on internal teams went down, hiring timelines sped up, and support expanded into additional markets and subsidiary organizations.", "stats": [{"value": "25+", "label": "Critical roles filled across technology, finance and operations"}], "headline": "25+ critical roles filled while the firm moved headquarters and transformed its technology.", "quote": null, "placement": null, "statsDerived": null, "source": "https://www.vaco.com/resources/case-studies/scaling-talent-support-relocation-transformation/", "published": "2026-06-26", "id": 30, "slide": null}, {"title": "PLM & Data Engineering Talent for a Global Food Safety SaaS Leader", "client": "Global Food Safety, Testing & Certification Leader", "industry": "Food Safety, Testing & Certification", "industryGroup": "Food Safety & Testing", "services": "Strategic Staffing · Direct Hire", "serviceGroup": "Direct Hire", "expertise": "Product Lifecycle Management (PLM) & Data Engineering", "location": "Not disclosed", "state": "Not disclosed", "primary": "Enterprise Applications", "tags": ["Enterprise Applications", "Data & Analytics"], "challenge": "The client struggled to find Product Lifecycle Management (PLM) and data engineering candidates who combined technical skill, client-facing ability and regulatory knowledge. Earlier vendors favored speed over quality, producing poor-fit candidates and wasted effort. With limited internal capacity to implement and customize its SaaS product, the client couldn't scale to meet demand, slowing product adoption and customer success.", "solution": "Vaco by Highspring took a relationship-first approach focused on highly qualified candidates over volume. It started with contract PLM placements to build credibility, then expanded through internal advocacy, stronger stakeholder relationships and access to executive leadership, growing from a transactional vendor into a trusted partner for contract and full-time hiring across several functions, and helping streamline the client's hiring process.", "impact": "Over two years Vaco completed about 25 placements and built a consistent talent pipeline, moving from contract support to strategic full-time hires, including 6 full-time placements in high-impact roles. Several consultants converted to full-time and advanced within the company, and the client created new roles specifically for Vaco by Highspring candidates, helping it scale operations, improve customer support and build an internal team to meet demand.", "stats": [{"value": "~25", "label": "Placements over two years"}, {"value": "6", "label": "Full-time placements in high-impact roles"}], "headline": "About 25 placements in two years, growing from contract PLM help to full-time strategic hires.", "quote": null, "placement": null, "statsDerived": null, "source": "https://www.vaco.com/resources/case-studies/food-safety-testing-talent-growth/", "published": "2026-04-28", "id": 31, "slide": null}];

/* ---------- library ---------- */
function matches(c, skip){
  for (const [k,,field] of FILTERS){
    if (k===skip) continue;
    const set=S.f[k]; if (!set.size) continue;
    if (!vals(c,field).some(v=>set.has(v))) return false;
  }
  if (S.q){
    const hay=[c.title,c.client,c.headline,c.industry,c.expertise,c.services,c.location,c.challenge,c.solution,c.impact,c.tags.join(' '),c.state].join(' ').toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

/* ---------- count up ---------- */
function parseNum(v){ const m=String(v).match(/^([+−\-$]?)(\d[\d,]*)(\.?\d*)(.*)$/); if(!m) return null; return {pre:m[1], n:parseFloat((m[2]+m[3]).replace(/,/g,'')), dec:(m[3]||'').length>1?m[3].length-1:0, post:m[4]}; }
function countUp(nodes){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return; io.unobserve(e.target);
    const el=e.target; el.closest('.stat')?.classList.add('vis');
    const raw=el.dataset.count; const p=parseNum(raw); if(!p||matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=raw; return; }
    const t0=performance.now(), d=1100;
    (function tick(t){ const k=Math.min(1,(t-t0)/d), ease=1-Math.pow(1-k,3);
      el.textContent=p.pre+(p.n*ease).toFixed(p.dec).replace(/\B(?=(\d{3})+(?!\d))/g,',')+p.post;
      if(k<1) requestAnimationFrame(tick); else el.textContent=raw; })(t0);
  }),{threshold:.3});
  nodes.forEach(n=>io.observe(n));
  setTimeout(()=>nodes.forEach(n=>{ if(n.closest('.stat')&&!n.closest('.stat').classList.contains('vis')){ io.unobserve(n); n.closest('.stat').classList.add('vis'); n.textContent=n.dataset.count; } }),2500);
}
