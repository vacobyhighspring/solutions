<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Studies & Client Success Stories · Highspring | Vaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072942; --navy2:#0d3352; --navy3:#123c5e; --orange:#F95C15; --orange-soft:#fff0e8;
  --sky:#3BA9E6; --blue:#1A8FCF; --cyan:#2DBFF9; --bg:#F3F6F9; --bg2:#E9EFF5;
  --ink:#072942; --body:#33475b; --muted:#6b7c8d; --line:#dde5ec; --white:#fff;
  --r:8px; --shadow:0 1px 2px rgba(7,41,66,.06),0 8px 24px -12px rgba(7,41,66,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--body);background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.eyebrow:before{content:"";width:26px;height:2px;background:var(--orange);flex:none}
.eyebrow.plain:before{display:none}
.eyebrow.sky{color:var(--sky)} .eyebrow.sky:before{background:var(--sky)}
.num-tag{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:800;font-size:12px;padding:4px 8px;border-radius:3px;letter-spacing:.04em}
h1,h2,h3,h4{color:var(--ink);font-weight:800;letter-spacing:-.015em;line-height:1.12}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.brand img{height:38px;display:block}
.nav{display:flex;align-items:center;gap:8px}
.nav-hint{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--sky);margin-right:6px;white-space:nowrap}
.tab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:8px 13px;border:1.5px solid var(--navy);border-radius:5px;color:var(--navy);transition:.15s;white-space:nowrap}
.tab:hover{border-color:var(--sky);color:var(--blue)}
.tab.on{background:var(--sky);border-color:var(--sky);color:#fff}
.tab .count{display:inline-block;margin-left:6px;background:var(--orange);color:#fff;border-radius:9px;padding:0 6px;font-size:10px}

/* ---------- hero ---------- */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--sky) 0 55%,var(--orange) 55% 100%)}
.hero .wrap{position:relative;padding-top:52px;padding-bottom:56px}
.hero h1{color:#fff;font-size:clamp(34px,4.6vw,54px);margin:16px 0 18px;max-width:860px}
.hero h1 .hl{color:var(--sky)}
.hero .lede{color:#c9d6e2;font-size:17px;max-width:680px}
.rings{position:absolute;right:-60px;top:-40px;width:420px;height:420px;opacity:.9;pointer-events:none}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid rgba(255,255,255,.14);padding-top:26px}
.hero-stats>div{padding:0 22px;border-left:2px solid var(--sky)}
.hero-stats>div:nth-child(2n){border-color:var(--orange)}
.hero-stats b{display:block;font-size:40px;font-weight:800;line-height:1;color:var(--sky)}
.hero-stats>div:nth-child(2n) b{color:var(--orange)}
.hero-stats span{display:block;margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#c9d6e2}

/* ---------- filters ---------- */
.filterbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:30}
.filterbar .wrap{padding-top:16px;padding-bottom:14px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flabel{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.ftab{font-size:13px;font-weight:700;color:var(--navy);padding:7px 12px;border-radius:5px;background:var(--bg);border:1.5px solid transparent}
.ftab.on{border-color:var(--navy);background:#fff}
.ftab i{font-style:normal;color:var(--orange);margin-left:4px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:6px;padding:0 12px;height:38px;min-width:240px;border:1.5px solid transparent}
.search:focus-within{border-color:var(--sky);background:#fff}
.search input{border:0;background:none;font:inherit;font-size:14px;outline:none;width:100%;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--body);background:#fff;transition:.12s}
.chip:hover{border-color:var(--sky)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{opacity:.6;margin-left:4px;font-weight:700}
.active-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.active-row .pill{background:var(--orange-soft);color:#b23f0a;font-weight:700;padding:4px 10px;border-radius:999px;font-size:12px}
.active-row .pill button{margin-left:6px;font-weight:800}
.linkbtn{color:var(--blue);font-weight:700;font-size:13px}
.linkbtn:hover{text-decoration:underline}

/* ---------- section ---------- */
.section{padding:44px 0}
.section.tint{background:var(--bg)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:26px;margin-top:8px}
.results{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- case cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(7,41,66,.06),0 18px 34px -14px rgba(7,41,66,.28)}
.card .strip{height:4px;background:var(--svc,var(--sky))}
.card .in{padding:20px 22px 18px;display:flex;flex-direction:column;flex:1}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.card .big{font-size:38px;font-weight:800;color:var(--navy);line-height:1;margin-top:16px;letter-spacing:-.02em}
.card .big-l{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:38px}
.card h3{font-size:17.5px;margin-top:14px;line-height:1.25}
.card .client{font-size:13px;color:var(--body);margin-top:6px}
.card .foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);margin-top:18px}
.card .go{font-size:13px;font-weight:800;color:var(--blue)}
.card .go:after{content:" →"}
.card a.cover{position:absolute;inset:0;z-index:1}
.add{position:relative;z-index:2;font-size:12px;font-weight:800;padding:6px 10px;border-radius:5px;border:1.5px solid var(--navy);color:var(--navy);display:inline-flex;gap:6px;align-items:center}
.add.on{background:var(--orange);border-color:var(--orange);color:#fff}
.svc-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--bg);color:var(--navy);margin-top:10px;margin-right:6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--bg);border-radius:var(--r)}

/* ---------- tray ---------- */
.tray{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:60;background:var(--navy);color:#fff;border-radius:10px;box-shadow:0 18px 40px -10px rgba(7,41,66,.55);display:flex;align-items:center;gap:16px;padding:12px 14px 12px 20px;transition:transform .25s,visibility .25s;max-width:calc(100% - 24px);visibility:hidden}
.tray.show{transform:translate(-50%,0);visibility:visible}
.tray b{color:var(--orange)}
.tray .btn{white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.04em;padding:10px 16px;border-radius:6px;background:var(--orange);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.ghost.dark{border-color:var(--navy);color:var(--navy)}
.btn.next{padding:8px 8px 8px 18px;border-radius:8px;box-shadow:0 8px 20px -8px rgba(249,92,21,.6)}
.btn.next small{font-size:11px;letter-spacing:.16em;opacity:.9}
.btn.next .circ{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--orange);display:grid;place-items:center;font-size:16px}

/* ---------- case page ---------- */
.crumbs{background:var(--bg);border-bottom:1px solid var(--line)}
.crumbs .wrap{display:flex;align-items:center;justify-content:space-between;height:48px;font-size:13px;font-weight:700;color:var(--navy)}
.crumbs .pn{display:flex;gap:6px;align-items:center}
.crumbs .pn button{width:30px;height:30px;border-radius:5px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.crumbs .pn button:hover{border-color:var(--navy)}
.case-hero .wrap{padding-bottom:110px}
.case-hero .rings,.col-hero .rings{opacity:.28;right:-120px}
.case-hero h1{font-size:clamp(30px,3.8vw,46px);max-width:900px}
.case-hero .client-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#c9d6e2;font-size:16px}
.placement{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.placement:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:34px}
.meta button{text-align:left;padding:4px 18px;border-left:3px solid var(--sky);color:#fff;transition:.15s}
.meta button:nth-child(2n){border-color:var(--orange)}
.meta button:hover{background:rgba(255,255,255,.05)}
.meta small{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#8fb3cf}
.meta span{display:block;font-weight:700;font-size:14.5px;margin-top:3px;line-height:1.3}
.statband{margin-top:-78px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:16px}
.stat{background:#fff;border-radius:var(--r);box-shadow:0 2px 6px rgba(7,41,66,.08),0 22px 40px -22px rgba(7,41,66,.4);padding:24px 24px 22px;border-top:4px solid var(--sky);opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.stat.vis{opacity:1;transform:none}
.stat:nth-child(2){border-color:var(--orange)} .stat:nth-child(3){border-color:var(--navy)} .stat:nth-child(4){border-color:var(--cyan)}
.stat b{display:block;font-size:44px;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em}
.stat p{margin-top:10px;font-size:14px;color:var(--body);line-height:1.4}
.derived{font-size:11.5px;color:var(--muted);margin-top:10px}

.story-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.story-head h2{font-size:26px;margin-top:8px}
.toggle{display:inline-flex;background:var(--bg);border-radius:7px;padding:3px}
.toggle button{font-size:12.5px;font-weight:800;padding:7px 13px;border-radius:5px;color:var(--muted)}
.toggle button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(7,41,66,.15)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:flex;gap:16px;align-items:flex-start;text-align:left;padding:20px 22px;background:var(--bg);border-right:1px solid var(--line);transition:.18s;position:relative}
.step:last-child{border-right:0}
.step .n{font-size:44px;font-weight:800;line-height:.9;color:var(--sky)}
.step:nth-child(2) .n{color:var(--orange)} .step:nth-child(3) .n{color:var(--navy)}
.step h4{font-size:17px}
.step p{font-size:12.5px;font-weight:700;color:var(--blue);margin-top:2px}
.step.on{background:var(--navy)}
.step.on h4{color:#fff} .step.on .n{color:var(--orange)} .step.on p{color:var(--sky)}
.step:not(.on):hover{background:#fff}
.panel{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:28px 30px;margin-top:-1px}
.panel p{font-size:16px;line-height:1.7;color:var(--body);max-width:880px}
.panel p+p{margin-top:12px}
.progress{height:3px;background:var(--line);border-radius:2px;margin-top:22px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);transition:width .3s}
.panel-nav{display:flex;justify-content:space-between;margin-top:16px}
.stack .blk{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:26px 0;border-top:1px solid var(--line)}
.stack .blk:first-child{border-top:0;padding-top:4px}
.stack .blk h4{font-size:20px;display:flex;gap:12px;align-items:baseline}
.stack .blk h4 em{font-style:normal;font-size:28px;color:var(--sky)}
.stack .blk:nth-child(2) h4 em{color:var(--orange)}
.stack .blk p{font-size:15.5px;line-height:1.7}
.stack .blk p+p{margin-top:10px}

.quote{background:var(--navy);color:#fff;border-radius:var(--r);padding:34px 40px;position:relative;margin-top:28px;overflow:hidden}
.quote:before{content:"“";position:absolute;left:24px;top:-18px;font-size:150px;font-weight:800;color:var(--orange);line-height:1;opacity:.95}
.quote blockquote{font-size:18px;line-height:1.6;padding-left:72px;color:#e6eef5}
.quote cite{display:block;margin-top:14px;padding-left:72px;font-style:normal;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}

.case-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:34px}

/* ---------- collections ---------- */
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.colcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;transition:.18s;border-top:4px solid var(--sky)}
.colcard:nth-child(3n+2){border-top-color:var(--orange)} .colcard:nth-child(3n){border-top-color:var(--navy)}
.colcard:hover{transform:translateY(-3px)}
.colcard h3{font-size:20px}
.colcard p{font-size:14px}
.colcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.colcard .row .go{color:var(--blue);letter-spacing:0;font-size:13px;text-transform:none}
.colcard.build{background:var(--navy);border-color:var(--navy);border-top-color:var(--orange)}
.colcard.build h3{color:#fff} .colcard.build p{color:#c9d6e2}
.layout-ico{display:flex;gap:6px}
.layout-ico span{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:3px;background:var(--bg);color:var(--navy)}

.col-hero .wrap{padding-bottom:44px}
.col-title[contenteditable="true"]{outline:1.5px dashed rgba(255,255,255,.35);outline-offset:6px;border-radius:4px}
.col-title[contenteditable="true"]:focus{outline-color:var(--orange)}
.edit-hint{font-size:12px;color:#8fb3cf;margin-top:-6px;margin-bottom:12px}
.layoutbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:30}
.layoutbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:7px;overflow:hidden}
.seg button{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;color:var(--navy);border-right:1.5px solid var(--navy)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}

/* proof layout */
.proof{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 24px 22px;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pcard:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--sky),var(--blue))}
.pcard:nth-child(2n):after{background:linear-gradient(90deg,var(--orange),#ff8a4c)}
.pcard b.v{font-size:46px;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em}
.pcard .vl{font-size:14px;font-weight:600;color:var(--navy);margin-top:10px;line-height:1.4}
.pcard .who{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.pcard h3{font-size:16.5px;margin-top:10px}
.pcard p{font-size:14px;margin-top:8px}
.pcard .acts{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:16px}
.rm{font-size:12px;font-weight:800;color:var(--muted)}
.rm:hover{color:var(--orange)}

/* featured layout */
.feat{background:var(--navy);border-radius:var(--r);color:#fff;display:grid;grid-template-columns:1.35fr 1fr;gap:34px;padding:34px 36px;position:relative;overflow:hidden}
.feat:after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--orange)}
.feat h3{color:#fff;font-size:26px;margin-top:12px}
.feat p{color:#c9d6e2;margin-top:12px;font-size:15px;line-height:1.65}
.feat .fstats{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px;align-content:center}
.feat .fstats div{border-left:2px solid var(--sky);padding-left:14px}
.feat .fstats div:nth-child(2n){border-color:var(--orange)}
.feat .fstats b{display:block;font-size:30px;font-weight:800;color:#fff;line-height:1.05}
.feat .fstats span{display:block;font-size:12.5px;color:#a9bfd2;margin-top:6px;line-height:1.35}
.feat .btn{margin-top:20px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:18px}
.mini{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;background:#fff;box-shadow:var(--shadow);border-radius:var(--r);padding:16px 18px;text-align:left;border:1.5px solid transparent;transition:.15s}
.mini:hover{border-color:var(--sky);background:#fff}
.mini b{font-size:24px;overflow-wrap:anywhere;font-weight:800;color:var(--navy);line-height:1}
.mini small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mini h4{font-size:15px;margin-top:4px;line-height:1.3}
.mini .feature-btn{font-size:12px;font-weight:800;color:var(--blue);margin-top:6px;display:inline-block}

/* one-pager layout */
.op{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.op-h,.op-r{display:grid;grid-template-columns:52px 1.25fr 1.35fr 1fr 150px 34px;gap:18px;align-items:center;padding:14px 20px}
.op-h{background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.op-r{border-top:1px solid var(--line);background:#fff;text-align:left;width:100%;transition:.12s;font-size:14px}
.op-r:hover{background:var(--bg)}
.op-r .idx{font-weight:800;color:var(--orange);font-size:15px}
.op-r .t{font-weight:800;color:var(--ink);line-height:1.3}
.op-r .c{font-size:12.5px;color:var(--muted);margin-top:2px}
.op-r .ch{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.op-r .res b{display:block;font-size:22px;font-weight:800;color:var(--navy);line-height:1}
.op-r .res span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:3px}
.op-r .chev{font-size:18px;color:var(--navy);transition:transform .2s;text-align:center}
.op-r[aria-expanded="true"] .chev{transform:rotate(90deg)}
.op-x{display:none;background:var(--bg);padding:22px 20px 24px 90px;border-top:1px dashed var(--line)}
.op-x.open{display:block}
.op-x .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.op-x h5{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.op-x p{font-size:13.5px;line-height:1.6}
.op-x .more{margin-top:14px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(7,41,66,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:90;transform:translateX(100%);transition:transform .28s;overflow:auto;box-shadow:-20px 0 40px -20px rgba(7,41,66,.4)}
.drawer.show{transform:none}
.drawer .dh{background:var(--navy);color:#fff;padding:28px 32px 30px;position:relative}
.drawer .dh h2{color:#fff;font-size:26px;margin-top:12px}
.drawer .dh .x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-size:18px}
.drawer .db{padding:24px 32px 40px}
.drawer .stats{--n:3;gap:12px}
.drawer .stat{box-shadow:none;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px}
.drawer .stat b{font-size:30px}
.drawer .stat p{font-size:13px}
.drawer .stack .blk{grid-template-columns:1fr;gap:8px}
.drawer .meta{grid-template-columns:1fr 1fr;gap:14px 0;margin-top:22px}

/* footer */
.sitefoot{background:var(--navy);color:#c9d6e2}
.sitefoot .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px;font-size:13px;flex-wrap:wrap}
.sitefoot b{color:#fff;letter-spacing:.14em;font-size:12px;margin-right:10px}
.sitefoot .r{display:flex;align-items:center;gap:14px}
.sitefoot .r a.site{color:var(--orange);font-weight:700}
.sitefoot .r .sep{opacity:.4}
.sitefoot .top{border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:5px 10px;font-weight:700;color:#fff;font-size:12px}
.sitefoot .talk{background:var(--orange);color:#fff;font-weight:800;padding:8px 14px;border-radius:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:7px;opacity:0;transition:.2s;z-index:120;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .wrap{padding:0 20px}
  .nav-hint{display:none}
  .hero-stats,.meta{grid-template-columns:1fr 1fr;row-gap:22px}
  .stats{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr}
  .step{border-right:0;border-bottom:1px solid var(--line)}
  .feat{grid-template-columns:1fr}
  .stack .blk{grid-template-columns:1fr;gap:8px}
  .op-h{display:none}
  .op-r{grid-template-columns:40px 1fr 30px;row-gap:8px}
  .op-r .ch,.op-r .svc{display:none}
  .op-r .res{grid-column:2}
  .op-x{padding-left:20px}.op-x .cols{grid-template-columns:1fr}
  .rings{display:none}
  .filterbar,.layoutbar{position:static}
  .topbar .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .search{min-width:0;flex:1 1 100%;margin-left:0}
}
@media (max-width:560px){ .tab{padding:7px 9px;font-size:10px} .stats{grid-template-columns:1fr} .brand img{height:30px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.stat{opacity:1;transform:none}}
.srcline{font-size:13px;color:#5d7088;margin:18px 0 0}.srcline a{color:inherit}
.card .big.txt{font-size:22px;line-height:1.15}.stat.txt b{font-size:20px;line-height:1.2}.svc-tag.src{background:transparent;border:1px solid var(--line);color:var(--muted)}
.sitefoot .wrap{flex-wrap:wrap}.sitefoot .disc{flex-basis:100%;font-size:12px;color:#8fa6ba;margin:0 0 10px}

/* ===== modern refresh ===== */
:root{--r:16px;--glass:rgba(255,255,255,.08)}
body{background:#f6f8fb}
.topbar{background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(14px)}
.hero{background:radial-gradient(900px 420px at 85% -10%,rgba(45,191,249,.28),transparent 60%),radial-gradient(700px 380px at -10% 110%,rgba(249,92,21,.22),transparent 60%),linear-gradient(160deg,#061f33 0%,#072942 55%,#0b3556 100%)}
.hero:after{height:4px;background:linear-gradient(90deg,var(--cyan),var(--sky) 45%,var(--orange) 75%,#FF8A50)}
.hero h1{letter-spacing:-.03em}
.hero h1 .hl{background:linear-gradient(90deg,var(--cyan),#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-stats>div{background:var(--glass);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px)}
.filterbar{background:rgba(255,255,255,.9);backdrop-filter:blur(10px)}
.ftab{border-radius:999px;padding:7px 14px}
.ftab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search input,.search{border-radius:999px!important}
.section.tint{background:linear-gradient(180deg,#eef3f8,#f6f8fb 240px)}
.grid{gap:20px}
.card{border-radius:var(--r);border:1px solid rgba(7,41,66,.07);box-shadow:0 1px 2px rgba(7,41,66,.04),0 12px 32px -18px rgba(7,41,66,.35)}
.card:hover{transform:translateY(-5px);box-shadow:0 2px 6px rgba(7,41,66,.06),0 26px 50px -20px rgba(7,41,66,.45)}
.card .strip{height:3px}
.card .in{padding:20px 22px 18px}
.svc-tag{border-radius:999px;padding:4px 10px}
.kbadge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;margin-bottom:12px;background:#e8f5fd;color:var(--blue)}
.kbadge em{font-style:normal;font-weight:700;letter-spacing:.02em;text-transform:none;color:var(--muted);border-left:1px solid #c5e3f4;padding-left:8px}
/* client success story cards: dark, orange */
.card.k-s{background:radial-gradient(420px 220px at 110% -10%,rgba(249,92,21,.35),transparent 60%),linear-gradient(165deg,#0b3556,#072942 60%,#061f33);border-color:rgba(255,255,255,.06);color:#c9d6e2}
.card.k-s .strip{background:linear-gradient(90deg,var(--orange),#FF8A50)}
.card.k-s .kbadge{background:rgba(249,92,21,.16);color:#FF8A50;box-shadow:inset 0 0 0 1px rgba(249,92,21,.35)}
.card.k-s .top{color:#8fb3cf}
.card.k-s .big{background:linear-gradient(90deg,#FF8A50,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.card.k-s .big.txt{background:linear-gradient(90deg,#fff,#c9e9fb);-webkit-background-clip:text;background-clip:text}
.card.k-s .big-l,.card.k-s .client{color:#a9bed1}
.card.k-s h3{color:#fff}
.card.k-s .svc-tag{background:rgba(255,255,255,.08);color:#e3edf5}
.card.k-s .foot{border-top-color:rgba(255,255,255,.12)}
.card.k-s .go{color:#FF8A50}
.card.k-c .big{background:linear-gradient(90deg,var(--navy),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
/* detail heroes */
.kbadge.big{font-size:11.5px;padding:7px 13px;margin-bottom:16px}
.case-hero.k-s{background:radial-gradient(800px 420px at 90% -20%,rgba(249,92,21,.38),transparent 60%),radial-gradient(600px 360px at -10% 120%,rgba(255,138,80,.18),transparent 60%),linear-gradient(160deg,#061f33,#072942 60%,#0b3556)}
.case-hero.k-s .kbadge{background:rgba(249,92,21,.18);color:#FF8A50;box-shadow:inset 0 0 0 1px rgba(249,92,21,.45)}
.case-hero.k-s:after{background:linear-gradient(90deg,var(--orange),#FF8A50)}
.case-hero.k-c{background:radial-gradient(800px 420px at 90% -20%,rgba(45,191,249,.40),transparent 60%),linear-gradient(160deg,#072942,#0b3d63 55%,#11558a)}
.case-hero.k-c .kbadge{background:rgba(45,191,249,.16);color:#9fe0ff;box-shadow:inset 0 0 0 1px rgba(45,191,249,.4)}
.case-hero.k-c .kbadge em{color:#c9e9fb;border-left-color:rgba(255,255,255,.25)}
.case-hero.k-c:after{background:linear-gradient(90deg,var(--cyan),var(--sky))}
.stat{border-radius:14px!important}
.case-hero.k-s~.statband .stat{border-top:3px solid var(--orange)}
.case-hero.k-c~.statband .stat{border-top:3px solid var(--sky)}
.case-hero.k-s~.statband .stat b{background:linear-gradient(90deg,#FF8A50,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:999px!important}
.fade{animation:fadeup .45s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.card:hover{transform:none}}
</style>
</head>

<script>
const CASES = [{"id": 1, "title": "IT Integration and Support for Growth Strategy", "client": "Top 25 U.S. CPA Firm", "headline": "Seven acquired firms integrated in one year with zero lost devices.", "challenge": "A $700M top 25 U.S. CPA firm urgently needed an integration and deployment team to support its aggressive growth strategy of acquiring eight to ten accounting firms per year. Key objectives included transitioning to a shared services model, consolidating global offices, and adhering to location-based requirements. The scope spanned IT service management improvements, large-scale hardware deployments, continued deskside support, and seamless integration of newly acquired firms into the firm's Azure cloud environment.", "solution": "Vaco quickly partnered with the client and established a centralized team of consultants at the firm's headquarters to manage laptop provisioning across the East Coast. Vaco also led hardware deployments and office relocation efforts for locations in New York City, Long Island, Connecticut, New Jersey, North Carolina, and Florida. Over fifty consultants successfully supported the integration of seven acquired firms in a single year while maintaining consistent, high-quality customer service throughout the transition.", "impact": "By establishing a partnership rooted in trust, Vaco collaborated closely with the client to improve overall service quality throughout the acquisition integration process. These efforts increased employee retention and work efficiency while enabling the firm to continue delivering exceptional service to its own clients.", "quote": null, "placement": null, "industryGroup": "Professional Services", "industry": "Professional Services", "serviceGroup": ["Staff Augmentation"], "tags": ["IT Support & Service Desk"], "primary": "IT Support & Service Desk", "state": "New York", "location": "New York", "stats": [{"value": "150+", "label": "Consultants embedded to support integration and deployment"}, {"value": "+15%", "label": "Increase in customer satisfaction scores through improved technical assistance"}, {"value": "−20%", "label": "Reduction in support ticket volume via knowledge base and self-service"}], "brand": ["Northeast Team", "Vaco.com"], "source": "https://www.vaco.com/resources/case-studies/it-integration-support-cpa-firm-and-vaco-execute-growth-strategy/", "published": null, "kind": "Client Success Story"}, {"id": 2, "title": "Driving Portfolio Value Creation Through Data Intelligence & AI", "client": "Mid-Market Private Equity Firm", "headline": "Data and AI leaders embedded across portfolio companies to drive value creation.", "challenge": "A mid-market PE firm with a diverse portfolio spanning services, distribution, and technology-enabled businesses was unable to unlock the full value of its operating companies’ data. Fragmented systems, inconsistent reporting, and no centralized data or AI strategy meant deal teams and portfolio leadership lacked the visibility needed to identify margin improvements, optimize operations, and make faster, higher-conviction decisions. Without dedicated leadership and engineering talent at the portfolio company level, data remained an untapped value creation lever.", "solution": "Vaco placed Data Intelligence and AI leaders directly into portfolio companies to define strategy, build roadmaps, and drive execution tied to each company’s value creation plan. Under those leaders, Vaco is building out the entire data and business intelligence engineering team — standing up reporting, KPI dashboards, and analytics that give C-suite and deal teams real-time visibility into revenue drivers, cost structures, and operational performance. In parallel, these leaders are driving AI adoption across the portfolio, identifying high-impact use cases and embedding AI-driven automation and insights into day-to-day operations.", "impact": "Portfolio companies now operate with decision-ready data platforms that directly support value creation plans, operational improvements, and executive reporting. Deal teams and C-suite leaders have consistent, timely visibility into the metrics that drive returns — from revenue and margin to utilization and cost efficiency. AI adoption is accelerating across the portfolio, with leaders identifying and deploying use cases that reduce manual work, improve forecasting, and surface insights that were previously invisible. The model is designed to scale across future acquisitions, compressing time-to-value at each new platform.", "quote": null, "placement": null, "industryGroup": "Private Equity", "industry": "Private Equity", "serviceGroup": ["Direct Hire", "Executive Search"], "tags": ["AI & Machine Learning", "Data & Analytics", "Technology Leadership"], "primary": "Data & Analytics", "state": "New York", "location": "New York", "stats": [{"value": "Lead", "label": "Data & AI leaders embedded in portfolio companies to drive value creation"}, {"value": "Build", "label": "Full BI & engineering teams delivering KPI reporting and operational visibility"}, {"value": "Adopt", "label": "AI adoption driving automation, forecasting, and insights across the portfolio"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 3, "title": "End-to-End Digital Transformation & IT Department Buildout", "client": "PE-Backed Energy Services Company", "headline": "A complete IT department built from zero, with 100% of infrastructure moved to Azure.", "challenge": "A PE-backed energy services organization had no internal IT department, no technology leadership, and no modern infrastructure. Operations ran on an aging IFS/BOLO ERP, fully on-prem servers, legacy networking, and zero enterprise security, data, or application capabilities. With rapid organic growth and an aggressive M&A strategy, the company needed to build an entire IT organization from scratch and modernize every layer of its technology stack simultaneously.", "solution": "The company's newly appointed CIO engaged Vaco to execute a wall-to-wall digital transformation, embedding 20+ resources - from staff-level engineers through senior IT leadership - to build the entire IT department. The team migrated all on-prem infrastructure to Azure, implemented SAP S/4HANA to replace the legacy ERP, deployed SharePoint Online and custom mobile applications, built a centralized data and analytics platform on Microsoft Fabric, modernized the network architecture, stood up enterprise cybersecurity operations, and introduced AI capabilities across the organization.", "impact": "Built a fully staffed, self-sufficient IT organization where none existed. Delivered a modern enterprise platform on SAP S/4HANA, migrated 100% of infrastructure from on-prem to Azure, launched custom mobile apps and SharePoint Online for field and office teams, established a Fabric-based data platform with AI-driven insights, modernized networking across all sites, and implemented a mature cybersecurity program—positioning the company for sustained PE-backed growth and seamless acquisition integration.", "quote": null, "placement": null, "industryGroup": "Energy & Utilities", "industry": "Energy & Utilities", "serviceGroup": ["Staff Augmentation"], "tags": ["Digital Transformation"], "primary": "Digital Transformation", "state": "New York", "location": "New York", "stats": [{"value": "20+", "label": "Consultants partnered with the CIO to stand up a complete IT organization from scratch"}, {"value": "100%", "label": "Migrated to Azure with S/4HANA, SharePoint Online, custom mobile apps, and network modernization"}, {"value": "Secure", "label": "Fabric data platform, enterprise cybersecurity, and AI capabilities"}], "brand": ["Northeast Team", "Vaco.com"], "source": "https://www.vaco.com/resources/case-studies/energy-company-cloud-it-transformation/", "published": null, "kind": "Client Success Story"}, {"id": 4, "title": "Application Modernization, DevSecOps & M&A Enablement", "client": "Legal Technology & Court Reporting Leader", "headline": "20+ legacy .NET apps modernized with DevSecOps built into every pipeline.", "challenge": "Our client was scaling rapidly while managing a complex, legacy application ecosystem. Over 20 legacy .NET applications were limiting scalability and speed, ongoing M&A activity required complex system integrations and cutovers, and there was increasing need for secure, compliant delivery pipelines alongside a lack of scalable infrastructure and security alignment with engineering growth.", "solution": "Vaco embedded 25+ consultants across software engineering, infrastructure, DevSecOps, and security to drive a full-scale engineering transformation. The team modernized legacy .NET applications to modern React and Node.js stacks, built out scalable infrastructure engineering capabilities, stood up DevSecOps pipelines with security integrated into CI/CD from day one, and enabled seamless M&A system integrations and cutovers. Vaco operated as a true extension of the client’s engineering organization, delivering speed, quality, and security at scale.", "impact": "Accelerated product delivery through modern application architecture and streamlined CI/CD pipelines. Enabled seamless M&A integrations with repeatable playbooks for system cutovers. Strengthened security posture by embedding DevSecOps practices across all engineering workflows. Built a scalable engineering foundation with 25+ embedded consultants operating as a trusted extension of the client’s team.", "quote": null, "placement": null, "industryGroup": "Legal", "industry": "Legal", "serviceGroup": ["Staff Augmentation"], "tags": ["Cloud & Infrastructure", "Software Engineering"], "primary": "Software Engineering", "state": "New Jersey", "location": "New Jersey", "stats": [{"value": "25+", "label": "Consultants embedded across engineering, infrastructure, and security"}, {"value": "20+", "label": "Legacy .NET apps modernized to React and Node.js"}, {"value": "Harden", "label": "DevSecOps and security embedded into every CI/CD pipeline"}], "brand": ["Northeast Team", "Vaco.com"], "source": "https://www.vaco.com/resources/case-studies/legal-tech-cloud-modernization/", "published": null, "kind": "Client Success Story"}, {"id": 5, "title": "Insurance Technology Company Modernizes Banking Infrastructure", "client": "Insurance Technology Company", "headline": "60+ bank accounts migrated to a global partner with zero customer disruption.", "challenge": "Our client needed to migrate more than 60 customer bank accounts from a local bank to a global banking partner while maintaining zero disruption to customers, meeting strict KYC and regulatory requirements, and managing significant legacy system and ERP dependencies with limited internal bandwidth.", "solution": "Vaco delivered experienced program leadership and technical expertise to execute a phased, wave‑based migration approach. Off‑hours cutovers, dual‑banking models, and close coordination across finance, operations, and IT enabled a controlled, low‑risk transition while maintaining day‑to‑day operations.", "impact": "Vaco delivered an integrated, end‑to‑end approach combining program leadership, technical integration, accounting coordination, and operational execution. The engagement used a phased, wave‑based migration model with off‑hours cutovers, dual‑accounting support, and deep cross‑functional coordination.\nThe primary objective was to execute a secure, compliant, and seamless banking migration that preserved daily operations, enabled dual‑banking during transition, and established a scalable foundation for their ongoing BaaS platform growth.", "quote": null, "placement": null, "industryGroup": "Insurance", "industry": "Insurance", "serviceGroup": ["Staff Augmentation"], "tags": ["Program & Delivery Leadership", "Software Engineering"], "primary": "Program & Delivery Leadership", "state": "Connecticut", "location": "Connecticut", "stats": [{"value": "60+", "label": "Customer bank accounts migrated with zero disruption"}, {"value": "100%", "label": "Wave-based migrations completed on schedule"}, {"value": "Zero", "label": "Customer disruption during migration through dual-banking continuity model"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 6, "title": "Business Intelligence & Data Strategy Transformation", "client": "Leading Manufacturing Organization", "headline": "Report generation time cut by more than half after an ERP move to Business Central.", "challenge": "A leading manufacturing organization needed to modernize its data and reporting capabilities as part of its ERP transition from Adage to Microsoft Business Central. Reporting was fragmented, analytics capabilities were limited, and teams lacked centralized visibility into operations. The company required leadership and technical expertise to build a connected BI and data foundation that would scale with its new ERP environment.", "solution": "Partnered with the organization on a multi-phase Business Intelligence and ERP modernization program, delivering key leadership and technical hires to support data warehouse design, BI strategy, and automation. The initiative focused on integrating legacy and new ERP data, launching a self-service analytics platform, and embedding data governance across the business.", "impact": "Modernized the company's data and analytics landscape, transforming reporting from manual and reactive to automated, unified, and business-driven. Reduced report generation time by over 50 percent, enabled real-time operational visibility through self-service dashboards, and increased analytics adoption across departments post-ERP go-live.", "quote": {"text": "The Vaco team has been an excellent partner throughout our recruiting efforts. They consistently provide high-quality candidates and do an outstanding job of prescreening based on my specific requirements. I really appreciate the detailed summary emails they send for each candidate, which offer great insight and make it easy to evaluate fit quickly. They also do an excellent job of following our process closely, which is much appreciated and makes the partnership seamless", "by": "CIO, Confidential Client"}, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Staff Augmentation"], "tags": ["Data & Analytics", "Enterprise Applications"], "primary": "Data & Analytics", "state": "New York", "location": "New York", "stats": [{"value": "50%+", "label": "Faster report generation after ERP go-live"}, {"value": "Real-time", "label": "Operational visibility through self-service dashboards"}, {"value": "Unified", "label": "Legacy and new ERP data connected in one BI foundation"}], "brand": ["Northeast Team", "Vaco.com"], "source": "https://www.vaco.com/resources/case-studies/manufacturing-company-bi-erp-modernization/", "published": null, "kind": "Client Success Story"}, {"id": 7, "title": "Enterprise Data & Analytics Transformation", "client": "Benefits Administration & Enrollment Platform", "headline": "A full data and analytics function stood up, starting with its first data leader.", "challenge": "A fast‑growing benefits administration and enrollment platform lacked a centralized analytics function to turn data into actionable insights. Fragmented reporting across business lines meant decisions were reactive, with no single source of truth. Without dedicated data leadership, the organization struggled to prioritize analytics investments, standardize KPIs, or leverage its growing data assets for competitive advantage.", "solution": "Vaco built a full Data & Analytics function from the ground up, starting with a Director of Data Analytics to lead strategy, team buildout, and technology modernization. Migrated legacy reporting to a scalable cloud data warehouse, implemented predictive analytics capabilities, and aligned the analytics roadmap with business goals to embed data‑driven decision‑making across the organization.", "impact": "Transformed reporting from ad hoc to proactive, making analytics a strategic growth pillar. Established enterprise‑wide visibility through standardized dashboards and predictive models, enabling leadership to shift from reactive decision‑making to data‑informed strategy across all business lines.", "quote": null, "placement": null, "industryGroup": "Technology & SaaS", "industry": "Technology & SaaS", "serviceGroup": ["Executive Search"], "tags": ["Data & Analytics", "Technology Leadership"], "primary": "Data & Analytics", "state": "New Jersey", "location": "New Jersey", "stats": [{"value": "Hire", "label": "Director of Data Analytics placed to lead strategy and full team buildout"}, {"value": "Scale", "label": "Migrated legacy reporting to scalable cloud data warehouse with predictive analytics"}, {"value": "Unified", "label": "Enterprise-wide visibility through standardized dashboards across all business lines"}], "brand": ["Northeast Team", "Vaco.com"], "source": "https://www.vaco.com/resources/case-studies/data-analytics-team-growth/", "published": null, "kind": "Client Success Story"}, {"id": 8, "title": "Infrastructure Leadership for Multi-Site Growth", "client": "Multi-Site Manufacturer", "headline": "A dedicated infrastructure leader for nearly 40 locations and an active acquisition pipeline.", "challenge": "The organization lacked a dedicated infrastructure leader, resulting in fragmented ownership across networking, infrastructure, and IT operations. The VP of IT was overextended, balancing application leadership with hands-on infrastructure support, including server maintenance, site outages, and vendor coordination. Upcoming acquisitions and a growing multi-site footprint (nearly 40 locations) increased complexity, while reliance on external vendors and inconsistent standards created risk to uptime, scalability, and long-term strategy.", "solut ation, IT asset management workflows, and service catalog buildout. Each hire was evaluated for deep ServiceNow platform expertise, ITIL knowledge, and the ability to operate across a complex, decentralized enterprise.", "impact": "Stood up a fully operational ServiceNow practice from the ground up, delivering a complete team spanning Director-level leadership through hands-on CMDB Engineers. Accelerated CMDB implementation and IT asset management standardization across 30+ operating companies. Established a scalable ServiceNow center of excellence that unified ITSM processes, improved configuration visibility, and positioned the organization for continued platform expansion including ITOM and SecOps modules.", "quote": null, "placement": null, "industryGroup": "Construction & Real Estate", "industry": "Construction & Real Estate", "serviceGroup": ["Executive Search", "Direct Hire"], "tags": ["Enterprise Applications", "Technology Leadership"], "primary": "Enterprise Applications", "state": "Northeast (Multi-Site)", "location": "Northeast (Multi-Site)", "stats": [{"value": "Full Team", "label": "Built end-to-end ServiceNow team from Director to CMDB Engineers"}, {"value": "30+", "label": "Operating companies unified under a single ServiceNow ITSM platform"}, {"value": "Scalable", "label": "Established a ServiceNow center of excellence positioned for ITOM and SecOps expansion"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 12, "title": "Data Engineering & Analytics Team Buildout", "client": "Leading Specialty Insurer", "headline": "An onshore data engineering team built to feed underwriting models and analytics.", "challenge": "A leading insurance company’s Strategic Analytics team needed to rapidly scale its data engineering capabilities to support a growing portfolio of predictive models and analytical tools. With only a small offshore team in place, the organization lacked the onshore engineering talent n utomation search focused on enterprise scale. The role was chartered to lead AI, ML, and intelligent automation initiatives across shared services, embed AI into core operational functions, and establish governance, intake, and prioritization frameworks. The engagement prioritized leaders with experience delivering AI at scale within complex enterprise environments, ensuring alignment between technology, operations, and executive stakeholders.", "impact": "Delivered an AI & Automation Director who unified fragmented initiatives into a centralized, enterprise-wide AI program. The organization improved visibility into AI investments, accelerated adoption across business functions, and established a sustainable model for scaling AI globally.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Executive Search"], "tags": ["AI & Machine Learning", "Technology Leadership"], "primary": "AI & Machine Learning", "state": "Connecticut", "location": "Connecticut", "stats": [{"value": "Unified", "label": "Fragmented AI initiatives unified under centralized enterprise-wide leadership"}, {"value": "Govern", "label": "Governance, intake, and prioritization frameworks established for AI investments"}, {"value": "Global", "label": "Sustainable model for scaling AI adoption across global business functions"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 18, "title": "Building an Enterprise AI & Data Function for a PE-Backed Energy Services Platform", "client": "PE-Backed Energy Services Platform", "headline": "A complete AI and data function built, from leadership to hands-on engineers.", "challenge": "A PE-backed energy services platform identified AI and advanced analytics as critical value-creation levers, but had no internal capability to execute. Data efforts were fragmented, AI initiatives were outsourced, and the organization lacked the leadership, engineering talent, and governance framework to scale AI alongside an aggressive M&A growth strategy. They needed a partner to build a complete AI and data function from scratch—spanning executive leadership through hands-on engineering.", "solution": "Highspring executed a multi-phase engagement combining direct hire and staff augmentation to stand up the entire AI and data organization. We placed senior AI and data leadership through executive search, then built out the supporting team—data engineers, ML engineers, analytics leads, and AI specialists—through staff augmentation. The function was architected to deliver enterprise reporting, predictive analytics, AI-enabled decisioning, and GenAI initiatives, all underpinned by proper data governance, security protocols, and scalability aligned to PE growth objectives.", "impact": "Delivered a fully operational AI and data function that eliminated third-party dependency, accelerated insight delivery, and embedded AI-driven decision-making across the enterprise. The organization now runs predictive analytics, ML models, and GenAI capabilities in-house—driving margin improvement, operational efficiency, and long-term value creation as a core internal capability rather than a bolt-on initiative.", "quote": null, "placement": null, "industryGroup": "Energy & Utilities", "industry": "Energy & Utilities", "serviceGroup": ["Direct Hire", "Staff Augmentation"], "tags": ["AI & Machine Learning", "Data & Analytics"], "primary": "AI & Machine Learning", "state": "New York", "location": "New York", "stats": [{"value": "AI Team", "label": "Full AI & data function built from leadership through engineering via direct hire and staff aug"}, {"value": "ML & AI", "label": "Predictive analytics, ML models, and GenAI capabilities deployed in-house"}, {"value": "Scale", "label": "Eliminated third-party dependency; AI now drives margin improvement and PE value creation"}], "brand": ["Northeast Team"], "source": nul ications while advancing compliance automation through AI. Built high-performing teams across security, IT, cloud, and compliance. The candidate was subsequently promoted to CISO/SVP, validating the strategic impact of the placement.", "quote": null, "placement": "CISO / SVP of Information Security, Compliance and IT", "industryGroup": "Healthcare", "industry": "Healthcare", "serviceGroup": ["Executive Search"], "tags": ["Cybersecurity", "Technology Leadership"], "primary": "Cybersecurity", "state": "Connecticut", "location": "Connecticut", "stats": [{"value": "20+", "label": "Years of progressive cybersecurity experience protecting client health data"}, {"value": "SOC 2", "label": "HITRUST and SOC 2 certifications maintained with AI-driven compliance automation"}, {"value": "CISO", "label": "Candidate promoted to CISO/SVP after building high-performing security teams"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 22, "title": "Building a Security Leadership Function for a Fortune 500 AEC Firm", "client": "Fortune 500 Construction Services Division", "headline": "A VP of Security placed who cut threat detection and response time by over 60%.", "challenge": "A multi-billion-dollar construction services division of a Fortune 500 engineering and construction group, operating across dozens of entities and thousands of employees, needed a VP of Security reporting directly to the CISO to build and lead the enterprise security function. With operations spanning 30+ locations, growing cyber risk exposure from M&A activity, and increasing regulatory scrutiny around federal and industry compliance standards, the organization required a seasoned security leader to establish governance, drive risk mitigation, and protect critical infrastructure at scale.", "solution": "Vaco delivered a VP of Security reporting to the CISO, bringing 20+ years of progressive cybersecurity leadership across enterprise environments. This leader brought deep expertise in security architecture, incident response, vulnerability management, and compliance frameworks (NIST, ISO 27001, CMMC) within complex, decentralized operations. The placement also brought proven experience building security teams from the ground up, establishing SOC capabilities, implementing zero-trust architecture, and aligning security strategy with business objectives across multiple operating companies and post-acquisition environments.", "impact": "Established a centralized security function across the client’s construction vertical, bringing governance and visibility to a previously fragmented security landscape. Reduced mean time to detect and respond to threats by over 60% through SOC buildout and SIEM implementation. Achieved compliance readiness across NIST 800-171 and CMMC frameworks, enabling the organization to pursue federal contracts with confidence while supporting continued M&A integration.", "quote": null, "placement": "VP of Security · Reports to CISO", "industryGroup": "Construction & Real Estate", "industry": "Construction & Real Estate", "serviceGroup": ["Executive Search"], "tags": ["Cybersecurity", "Technology Leadership"], "primary": "Cybersecurity", "state": "Northeast (Multi-Site)", "location": "Northeast (Multi-Site)", "stats": [{"value": "20+", "label": "Years of cybersecurity leadership delivered as VP of Security reporting to the CISO"}, {"value": "NIST", "label": "NIST 800-171 and CMMC compliance readiness achieved across the enterprise"}, {"value": "−60%", "label": "Reduction in mean time to detect and respond to threats through SOC and SIEM buildout"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 23, "title": "Dynamics GP Stabilization & Financial Operations", "client": "Private University", "headline": "Finance operations stabilized on Dynamics GP after a cloud migration.", "challenge": "After migrating Dynamics GP to the cloud and introducing Analytical Accounting for fund tracking, the university's finance team struggled to operate within the new structure. Core processes supporting budgeting, grants, scholarships, and financial reporting were disrupted, and IT leadership became the de facto owner of finance systems. The university needed immediate, hands-on GP expertise to stabilize operations under time pressure.", "solution": "Vaco provided a senior, master-certified Dynamics GP consultant with deep higher-education and fund-accounting experience. The consultant worked hands-on to stabilize day-to-day finance operations, correctly configure Analytical Accounting, and establish repeatable, auditable workflows across GP, Financial Aid, and Institutional Advancement systems. Knowledge transfer was a core focus to reduce long-term dependency on IT.", "impact": "Stabilized daily finance operations running on Dynamics GP and correctly configured Analytical Accounting to support fund, grant, and scholarship tracking. Established repeatable, auditable workflows across finance and institutional systems while reducing reliance on IT by enabling finance teams to operate independently.", "quote": null, "placement": null, "industryGroup": "Education", "industry": "Education", "serviceGroup": ["Staff Augmentation"], "tags": ["Enterprise Applications"], "primary": "Enterprise Applications", "state": "New Jersey", "location": "New Jersey", "stats": [{"value": "Live", "label": "Daily finance operations stabilized on Dynamics GP post-cloud migration"}, {"value": "Compliant", "label": "Repeatable, auditable workflows across budgeting, grants, and scholarships"}, {"value": "Self-Run", "label": "Finance teams operating independently, reducing long-term IT dependency"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 24, "title": "Large-Scale Endpoint Refresh & On-Site IT Support", "client": "Top 25 U.S. CPA Firm", "headline": "A floor-by-floor endpoint refresh finished on schedule with zero downtime.", "challenge": "A professional services firm operating out of a high-traffic New York City headquarters needed to execute a large-scale endpoint refresh spanning hundreds of employee workstations and laptops. The project carried a fixed delivery window, leaving little room for delays or extended downtime. Aging hardware and inconsistent device configurations were creating security vulnerabilities and productivity bottlenecks, while the internal IT team lacked the bandwidth to manage a rollout of this scale without disrupting day-to-day operations. Maintaining a seamless user experience throughout the transition was critical given the firm’s client-facing environment.", "solution": "Vaco embedded a team of dedicated, on-site technical resources at the firm’s NYC headquarters to lead device imaging, configuration, and deployment across all affected workstations. The team managed end-to-end logistics including data migration, application re-installation, peripheral setup, and secure retirement of legacy hardware in compliance with corporate data policies. Vaco coordinated closely with internal IT leadership to establish a phased rollout schedule that minimized disruption floor by floor, providing white-glove support to end users during the transition and ensuring each workstation was validated before handoff.", "impact": "The full endpoint refresh was completed on schedule with zero missed deadlines, delivering updated, standardized hardware across the entire headquarters. End users experienced minimal downtime thanks to the phased rollout approach, and the firm saw immediate improvements in device performance, security posture, and IT support ticket volume. Legacy equipment was securely decommissioned, and the internal IT team gained a repeatable playbook for future refresh cycles.", "quote": null, "placement": null, "industryGroup": "Professional Services", "industry": "Professional Services", "serviceGroup": ["Managed Services"], "tags": ["IT Support & Service Desk"], "primary": "IT Support & Service Desk", "state": "New York", "location": "New York", "stats": [{"value": "100%", "label": "Endpoint refresh completed on schedule with zero missed milestones"}, {"value": "Zero", "label": "Downtime through phased floor-by-floor rollout with white-glove user support"}, {"value": "Secure", "label": "Legacy hardware securely decommissioned with repeatable playbook for future cycles"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 25, "title": "Securing Cloud Infrastructure & Governance for a Global Beauty Corporation", "client": "Global Beauty Corporation", "headline": "A VP of Information Security placed who finished a stalled CyberArk rollout in 90 days.", "challenge": "A global beauty corporation needed a VP of Information Security to own governance, compliance, and the full security ecosystem across its Americas region. The previous leader had departed abruptly, leaving critical projects incomplete - including a CyberArk Privileged Access rollout and PCI compliance for retail POS operations. With a complex Azure cloud environment, outsourced security operations, and global coordination with headquarters in Tokyo, the organization required a hands-on security architect to drive remediation and connect regional strategy to a global framework.", "solution": "Highspring secured a VP of Information Security with 10+ years of progressive experience in enterprise security operations and Azure cloud architecture. The placement brought deep expertise across AzureAD, M365, InTune, and SharePoint security, along with proven PCI/PII compliance leadership and hands-on vulnerability management, penetration testing, and phishing exercises. This leader had a track record of bridging outsourced SOC operations with internal remediation - translating vendor findings into actionable improvements while serving as the organization’s security architect.", "impact": "Completed the CyberArk Privileged Access rollout within 90 days, closing a critical identity governance gap. Standardized security strategies across the Americas region and strengthened PCI compliance for retail operations spanning multiple locations. Established a unified governance framework connecting regional security with global headquarters, improving incident response coordination and regulatory readiness enterprise-wide.", "quote": null, "placement": "VP of Information Security · Reports to CIO", "industryGroup": "Retail & Consumer", "industry": "Retail & Consumer", "serviceGroup": ["Executive Search"], "tags": ["Cloud & Infrastructure", "Cybersecurity", "Technology Leadership"], "primary": "Cybersecurity", "state": "Northeast (Multi-Site)", "location": "Northeast (Multi-Site)", "stats": [{"value": "PCI", "label": "PCI/PII compliance framework established with unified security governance across the Americas"}, {"value": "90", "label": "Days to complete CyberArk Privileged Access rollout and Azure cloud security hardening"}, {"value": "Unified", "label": "Security strategy standardized connecting regional operations with global headquarters"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 26, "title": "UKG Workforce Management Implementation & HRIS Integration", "client": "Leading Health System", "headline": "A senior UKG analyst who sped up the WFM rollout and cleaned up HRIS-to-payroll data.", "challenge": "A leading health system was undertaking a major UKG Workforce Management capital project requiring deep functional expertise in timekeeping, advanced scheduling, and HRIS integration. The scope demanded a senior analyst who could bridge complex WFM configuration with IT governance, documentation standards, and cross-system integration across HRIS, Payroll, and downstream applications- a rare skill set in the healthcare WFM space.", "solution": "Vaco placed a Senior UKG Consultant with direct Dimensions experience in timekeeping rules, pay policies, and Advanced Scheduler configuration. Embedded in the UKG Capital Project team, the resource led implementation activities, translated business requirements into functional specifications, and established documentation and governance standards across the WFM program - including integration validation across HRIS and Payroll systems to ensure end-to-end data flow integrity.", "impact": "Strengthened HRIS integration governance and accelerated UKG WFM implementation timelines. The resource owned both configuration and documentation workstreams, enabling audit-ready processes, cleaner data flows between HRIS and Payroll, and reduced risk during system rollout across multiple facilities.", "quote": null, "placement": null, "industryGroup": "Healthcare", "industry": "Healthcare", "serviceGroup": ["Staff Augmentation"], "tags": ["Enterprise Applications"], "primary": "Enterprise Applications", "state": "New Jersey", "location": "New Jersey", "stats": [{"value": "Faster", "label": "Accelerated UKG rollout timeline by consolidating configuration and governance under one resource"}, {"value": "Cleaner", "label": "Reduced payroll errors and exceptions through validated HRIS-to-Payroll data flows"}, {"value": "Lower Risk", "label": "Audit-ready documentation and governance reduced compliance exposure across multi-facility rollout"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 27, "title": "Stabilizing IT Operations While Building Toward a Mature, Scalable Organization", "client": "Major Hospitality Company", "headline": "IT delivery kept moving through sudden leadership gaps while governance was built.", "challenge": "A major hospitality company operated a lean IT organization undergoing transformation across Azure and ServiceNow environments. The team faced limited governance, documentation, and standardized processes, with fragmented ownership across lization & Digital Transformation", "client": "Global Professional Services Firm", "headline": "A critical legacy platform stabilized and brought back under internal control.", "challenge": "A global professional services firm relied on a legacy platform that was highly customized and not fully integrated across the organization. Support was handled primarily by a third-party agency, but leadership lacked confidence in the depth of expertise, level of detail, and sustained effort needed to drive meaningful progress. As a result, the platform lacked stability and internal stakeholders had limited visibility and control.", "solution": "Vaco partnered with internal digital transformation leadership to reassess the support model and embed the right long-term expertise. Two experienced full-time resources were added to the team, bringing both strong technical capability and a clear understanding of business objectives. The team supported agile sprint planning and execution, platform configuration and deployment, peer reviews, and structured knowledge transfer to internal stakeholders.", "impact": "Improved stability of a critical legacy platform and reduced reliance on third-party vendors. Achieved stronger alignment between technical delivery and business goals with clearer communication between technical teams and business leadership.", "quote": null, "placement": null, "industryGroup": "Professional Services", "industry": "Professional Services", "serviceGroup": ["Consulting"], "tags": ["Digital Transformation", "Software Engineering"], "primary": "Digital Transformation", "state": "Remote", "location": "Remote", "stats": [{"value": "Stable", "label": "Critical legacy platform stabilized with reduced third-party vendor reliance"}, {"value": "Agile", "label": "Agile sprint planning and execution aligned technical delivery with business goals"}, {"value": "Transfer", "label": "Structured knowledge transfer giving internal stakeholders visibility and control"}], "brand": ["Northeast Team"], "source": null, "published": null, "kind": "Client Success Story"}, {"id": 29, "title": "Oracle Fusion ERP Implementation Support for a Defense Technology Company", "client": "Defense Technology Company", "headline": "Specialized technology and finance talent kept an Oracle Fusion ERP implementation moving.", "challenge": "A defense technology company faced significant challenges during its ERP migration. The project needed a highly skilled finance team to manage data, ensure compliance with ASC 606 revenue recognition standards and perform thorough contract reviews, work that required SQL, advanced Excel and prior ERP implementation experience. Separately, its technical accounting and hardware design teams faced critical resource shortages. After struggling to find a vendor that could fill these gaps, the company needed a partner who could quickly source high-performing talent for both its technology and finance functions.", "solution": "Vaco stepped in as a trusted partner, providing tailored support across financial planning and analysis, technical accounting and hardware design. The team connected the client with talent to manage data migrations, support the Oracle Fusion ERP implementation, address revenue recognition and contract reviews, and build a culture of efficiency in a fast-paced environment. The ongoing partnership includes performance tracking for newly onboarded talent and fast responses to urgent requests as bandwidth needs change.", "impact": "The partnership helped the client move its ERP implementation forward while keeping momentum across multiple initiatives. Vaco filled critical resource gaps quickly, scaling support where it was needed most across technology and finance: one cost consultant for a full year, six consultants for the technical accounting team, four for the FP&A team, added headcount for the Oracle Fusion ERP go-live, and AP and AR consultants to support rapid growth.", "quote": null, "placement": null, "ind melines sped up, and support expanded into additional markets and subsidiary organizations.", "quote": null, "placement": null, "industryGroup": "Financial Services", "industry": "Financial Services", "serviceGroup": ["Direct Hire"], "tags": ["Digital Transformation"], "primary": "Digital Transformation", "state": "Not specified", "location": "Not specified", "stats": [{"value": "25+", "label": "Critical roles filled across technology, finance and operations"}], "brand": ["Vaco.com"], "source": "https://www.vaco.com/resources/case-studies/scaling-talent-support-relocation-transformation/", "published": "2026-06-26", "kind": "Case Study"}, {"id": 31, "title": "PLM & Data Engineering Talent for a Global Food Safety SaaS Leader", "client": "Global Food Safety, Testing & Certification Leader", "headline": "About 25 placements in two years, growing from contract PLM help to full-time strategic hires.", "challenge": "The client struggled to find Product Lifecycle Management (PLM) and data engineering candidates who combined technical skill, client-facing ability and regulatory knowledge. Earlier vendors favored speed over quality, producing poor-fit candidates and wasted effort. With limited internal capacity to implement and customize its SaaS product, the client couldn't scale to meet demand, slowing product adoption and customer success.", "solution": "Vaco by Highspring took a relationship-first approach focused on highly qualified candidates over volume. It started with contract PLM placements to build credibility, then expanded through internal advocacy, stronger stakeholder relationships and access to executive leadership, growing from a transactional vendor into a trusted partner for contract and full-time hiring across several functions, and helping streamline the client's hiring process.", "impact": "Over two years Vaco completed about 25 placements and built a consistent talent pipeline, moving from contract support to strategic full-time hires, including 6 ful "Construction & Real Estate", "serviceGroup": ["Consulting"], "tags": ["Data & Analytics", "AI & Machine Learning", "Program & Delivery Leadership"], "primary": "Data & Analytics", "state": "Not specified", "location": "Not specified", "stats": [], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/building-foundation-data-driven-transformation/", "published": "2026-11-10", "kind": "Case Study"}, {"id": 33, "title": "From Data Sprawl to a Single Source of Truth", "client": "Publicly Traded Healthcare REIT", "headline": "Five disconnected systems unified into one governed analytics platform.", "challenge": "A healthcare real estate firm operating in 30+ markets relied on disconnected ERP, CRM, construction and planning tools plus many spreadsheets. Teams spent their time reconciling conflicting metrics, and direct queries slowed operational systems.", "solution": "Highspring built a unified analytics platform on Microsoft Fabric that automatically pulls data from five core systems. Financial data was isolated to support SOX compliance, and leaders agreed on shared metric definitions using licenses the client already owned.", "impact": "Hours of weekly manual reporting were eliminated across four divisions, giving the business one trusted version of each key metric. Production systems were protected and the company is ready for predictive modeling and AI.", "quote": null, "placement": null, "industryGroup": "Construction & Real Estate", "industry": "Construction & Real Estate", "serviceGroup": ["Consulting"], "tags": ["Data & Analytics"], "primary": "Data & Analytics", "state": "Not specified", "location": "Not specified", "stats": [{"value": "5", "label": "Systems unified into one platform"}, {"value": "4", "label": "Divisions freed from manual reporting"}, {"value": "30+", "label": "Markets served by the client"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/data-sprawl-single-sourc ivery.", "challenge": "Each team built its own delivery pipelines, leading to inconsistent security, duplicated work and rising maintenance costs. The organization needed a shared GitHub Enterprise foundation that met strict security and governance requirements.", "solution": "Highspring worked with the client's cloud and engineering teams to build a GitHub Enterprise Cloud platform with identities managed through Microsoft Entra ID and automated provisioning. It delivered standardized GitHub Actions patterns for builds, testing, security scanning and releases, and planned the retirement of overlapping DevOps tools.", "impact": "Teams now reuse common pipeline patterns, keeping security consistent as adoption grows. Onboarding and governance standards plus a legacy-tool retirement roadmap set up simpler delivery and lower long-term costs.", "quote": null, "placement": null, "industryGroup": "Financial Services", "industry": "Financial Services", "serviceGroup": ["Consulting"], "tags": ["Software Engineering", "Cloud & Infrastructure", "Cybersecurity"], "primary": "Software Engineering", "state": "Not specified", "location": "Not specified", "stats": [], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/building-github-enterprise-delivery-platform/", "published": "2026-11-06", "kind": "Case Study"}, {"id": 36, "title": "Automating RFQ Quoting Without Adding Headcount", "client": "Independent Industrial Gas & Welding Supply Distributor", "headline": "An AI pipeline turns RFQ emails into draft quotes without added headcount.", "challenge": "Hundreds of weekly RFQ emails arrived in mixed formats and were processed by hand. Each quote required matching competitor part numbers to internal SKUs, so speed and quality depended on each rep's experience.", "solution": "Highspring built an AI quoting pipeline that reads requests in several formats, including scanned images via OCR. It matches parts against the ERP through a multi-step loo ic safely.", "challenge": "COVID-19 hit midway through an Epic implementation that included a newly acquired community hospital and six affiliated clinics. The system needed the new hospital on the same EHR while protecting staff and patient safety.", "solution": "Highspring moved all training from classrooms to a fully virtual format with self-guided eLearning, instructor-led sessions, exercises and remote proficiency assessments. IT support staff tested the remote training technology, and completion was tracked through formal registration and verification.", "impact": "On-site resources were cut by one-third, lowering contact risk for staff and patients. The go-live succeeded safely and saved $65K.", "quote": null, "placement": null, "industryGroup": "Healthcare", "industry": "Healthcare", "serviceGroup": ["Consulting"], "tags": ["EHR & Clinical Systems", "Program & Delivery Leadership"], "primary": "EHR & Clinical Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "$65K", "label": "Cost savings from the virtual approach"}, {"value": "1/3", "label": "Fewer on-site resources"}, {"value": "6", "label": "Affiliated clinics brought live"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/virtual-ehr-training-and-go-live/", "published": "2020-06-24", "kind": "Case Study"}, {"id": 80, "title": "Scaling a Software & Payments Company with Nearshore Engineering Squads", "client": "Large Software & Payments Company", "headline": "Nearshore engineering squads that delivered on time and stayed.", "challenge": "Rapid growth through acquisitions strained internal teams and exposed critical technical skill gaps. Existing nearshore and offshore providers lacked the agility and expertise for time-sensitive projects.", "solution": "Highspring built a customized nearshore and offshore program with global squads of security and platform engineers, product managers and front- and back-end developers. Clear KPI /* ---------- library ---------- */
function matches(c, skip){
  for (const [k,,field] of FILTERS){
    if (k===skip) continue;
    const set=S.f[k]; if (!set.size) continue;
    if (!vals(c,field).some(v=>set.has(v))) return false;
  }
  if (S.q){
    const hay=[c.title,c.client,c.headline,c.industry,c.expertise,c.services,c.location,c.challenge,c.solution,c.impact,c.tags.join(' '),c.state,c.serviceGroup.join(' '),c.brand.join(' '),c.kind,c.industryGroup].join(' ').toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}
