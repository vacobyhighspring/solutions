 and no standard approvals.", "solution": "Highspring placed an interim CAO and controller and took over the office of the CFO. It led technical accounting work including debt restructuring, amortization schedules and journal entries, designed more than 12 standard operating procedures, took over AP and AR with added workflow automation, analyzed sales commissions and introduced new expense policies and controls. It also built a data governance architecture, cleansed and de-duplicated data and created a governance playbook with data lineage mapping, all in under six months.", "impact": "Month-end close dropped from 11 days to 8, expense submission time fell 75%, late fees were eliminated and data accuracy now exceeds 99%. Governance is in place across finance and data, the company is audit-ready, and the playbook has since supported integration of multiple acquisitions.", "quote": null, "placement": null, "industryGroup": "Professional Services", "industry": "Professional Services", "serviceGroup": ["Consulting"], "tags": ["Data & Analytics", "Enterprise Applications", "Digital Transformation"], "primary": "Data & Analytics", "state": "Not specified", "location": "Not specified", "stats": [{"value": "99%", "label": "Data accuracy"}, {"value": "11 → 8", "label": "Days to close the month"}, {"value": "75%", "label": "Faster expense processing"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/pe-backed-finance-data-transformation/", "published": "2025-11-07", "kind": "Case Study", "ownership": "PE-Backed"}, {"id": 99, "title": "Reengineering Supply Chain Planning on Blue Yonder", "client": "Restaurant Distribution Provider", "headline": "A simplified Blue Yonder platform ready to scale across brands.", "challenge": "A leading distribution solutions provider serving the restaurant industry had a heavily customized, underused supply chain planning environment. It wanted to extend its Blue Yonder platform and processes to more business units, gain new capabilities through an upgrade and refine forecasting to improve scale and planner productivity.", "solution": "Highspring assessed current systems and processes against industry best practices, removed unnecessary customizations and shifted to the tools' native functionality. Using its supply chain-as-a-service offering as an accelerator, it onboarded new business units and extended the refined processes to other brands the client serves.", "impact": "Forecasts now regularly include market intelligence through Demand360, and planners spend their time enriching forecasts for new menu items, promotions and limited-time offers. Store-level ingredient planning is in place, and sustainable workflows support current operations and future business units.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Enterprise Applications"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/reengineered-supply-chain-planning/", "published": "2026-03-30", "kind": "Case Study", "ownership": "Other"}, {"id": 100, "title": "Consolidating 11 Planning Systems for a Beverage Manufacturer", "client": "Multinational Beverage Manufacturer", "headline": "Eleven planning systems consolidated into one global cloud platform.", "challenge": "A multinational beverage manufacturer and distributor had to decide whether its existing supply chain software, and an upcoming upgrade, would serve it long term or whether it needed a new platform. Years of business unit rationalization had left nearly a dozen similar units planning in slightly different ways on separately customized planning tools, with added licensing complexity.", "solution": "Highspring proposed one global template with standardized processes and architecture on Blue Yonder's cloud planning platform. Phase 1 built the unified platform, with local adaptations for individual business units planned for Phase 2, using best practices and a fit-gap exercise to decide what to standardize and what to localize. The team used agile delivery, shared development and architecture resources across parallel workstreams with Blue Yonder, integrated the platform with Azure through MuleSoft APIs and trained the client's managed services provider to deploy and customize future phases.", "impact": "Eleven separate planning systems were consolidated into a single cloud instance serving more than ten business units. The design phase was shorter than planned, and the company now has a platform built to scale globally.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Enterprise Applications", "Cloud & Infrastructure"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "11 → 1", "label": "Planning systems consolidated"}, {"value": "10+", "label": "Business units on one platform"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/beverage-manufacturer-growth/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 101, "title": "Supply Chain Network Modeling Cuts $5M for a Snack Manufacturer", "client": "Private Label Snack Manufacturer", "headline": "Network modeling that cut $5M in year one across 11 plants.", "challenge": "One of the world's largest private label snack suppliers, with more than $1B in revenue and 12,000-plus customer locations across North America, Europe and Asia, runs 11 plants in the U.S. and Canada, nine of them acquired in the past decade. The acquisitions created manufacturing overlap, and the company needed to decide what each plant should make, which customers each should serve and where to add capacity. Inconsistent product naming meant universal product identifiers had to be set up in the ERP first.", "solution": "Highspring recommended putting the company's unused Blue Yonder Supply Chain Strategist licenses to work. It trained the supply chain team on the tool, designed and built the network model and worked with the team to interpret the results, using its root cause analysis tool to find and fix source data problems during the build.", "impact": "The company cut $5M in costs in year one, lifting EBITDA by more than 5%, and expects another $18M to $20M in reductions over the next two years. The analysis showed that a time-limited plant acquisition would pay off by lowering supply chain costs and pinpointed the best location for the next plant.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Data & Analytics", "Enterprise Applications"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "$5M", "label": "Year-one cost reduction"}, {"value": "$18–20M", "label": "Expected two-year savings"}, {"value": "11", "label": "Plants modeled"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/tackling-snack-manufacturer-growth/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 102, "title": "Powering a Vendor-Managed Inventory Program for a Bottled Water Supplier", "client": "Private-Label Bottled Water Supplier", "headline": "A hosted VMI platform that helped win national retail accounts.", "challenge": "A North American private-label bottled water supplier with plants in the U.S. and Mexico already used Blue Yonder for corporate demand planning. It launched a vendor-managed inventory program to improve service and connect its supply chain through to retail, but its existing system couldn't support VMI, and it wanted a solution that wouldn't add another vendor for IT to manage.", "solution": "Highspring expanded Blue Yonder to handle daily demand and fulfillment planning and added a third-party tool to manage EDI transactions and prepare retail data. Using its toolkit and Core accelerator with an agile approach, it built a configurable, multi-tenant design so each new retail customer needs onboarding rather than a new implementation, plus a toolkit for estimating onboarding costs. Highspring Managed Services hosts the solution on AWS and handles data transformation and staging for EDI and point-of-sale data, scaling support up as the program grew faster than expected.", "impact": "The supplier had a best-in-class planning solution live quickly, with customer point-of-sale data flowing directly into VMI planning. It has since become a strategic supplier to large national retailers, including a big-box multi-category chain and a major dollar store chain.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Managed Services"], "tags": ["Supply Chain Systems", "Data & Analytics", "Cloud & Infrastructure"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/bottled-water-supplier-vmi-solution/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 103, "title": "Improving Forecast Accuracy for a Luggage & Handbag Brand", "client": "U.S. Luggage & Handbag Design Company", "headline": "Sharper forecasts and allocation visibility in six months.", "challenge": "A U.S. luggage and handbag design company planned pre-season and in-season buys in Excel, which made it hard to measure forecast accuracy consistently across channels. Planners had no controlled yearly and monthly forecast snapshots, inventory forecasts ignored minimum presentation quantities and safety stock, and allocators had little visibility into in-stock levels when prioritizing work.", "solution": "Over six months, Highspring applied Blue Yonder's PlanNow methodology. It introduced two locked forecast versions, an original and a revised SKU plan, added an admin-controlled process for submitting working plans, expanded the forecast calculation from three variables to four and configured the parameters. It also added two columns to the allocation worklist to bring business intelligence into allocation decisions.", "impact": "Locked plan versions make forecast accuracy measurable, and inventory calculations now account for safety stock and presentation minimums, producing more precise buys with fewer overages and stockouts. Allocators can see in-stock levels, prioritize faster and respond quickly to at-risk products.", "quote": null, "placement": null, "industryGroup": "Retail & Consumer", "industry": "Retail & Consumer", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Data & Analytics"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "6 mo", "label": "Engagement length"}, {"value": "3 → 4", "label": "Forecast variables"}, {"value": "2", "label": "Locked forecast versions"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/luggage-handbag-company-forecasting-solution/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 104, "title": "Modernizing Demand & Supply Planning for a Protein Processor", "client": "Major U.S. Protein Processor", "headline": "Shelf-life-aware planning across 35,000+ SKUs.", "challenge": "A major U.S. chicken, turkey and pork processor harvests more than 500 million chickens a year across nearly 20 plants, more than 60 distribution centers and freezers and more than 40 copackers. Its aging demand and fulfillment systems were on life support. It needed stronger demand planning and consensus forecasting, plus constraint-based supply planning that respects customer-specific shelf life for fresh and frozen products, reflects capacity and material limits and connects East and West Coast operations.", "solution": "Highspring led the implementation of JDA Demand, Demand 360 and ESP, working with IT on interfaces, data mapping, integration and user acceptance testing and supporting training and knowledge transfer. It built custom date-sensitive inventory in ESP that calculates pounds of harvested birds by meat cut, and worked with Blue Yonder to carry shelf life through the bills of material.", "impact": "This was the poultry industry's first successful large-scale ESP deployment with date-sensitive inventory. Forecasting improved with Highspring's Demand Core, planners work by exception, JDA is integrated with SAP MRP and minimum shelf life and expiration dates are calculated across more than 35,000 SKUs, with a framework in place for logistics integration and advanced order promising.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Enterprise Applications"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "35,000+", "label": "SKUs with shelf-life tracking"}, {"value": "60+", "label": "Distribution centers and freezers"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/solving-legacy-poultry-manufacturer-planning/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 105, "title": "Migrating a Hardware Cooperative to Next-Generation Supply Chain Planning", "client": "Member-Owned Hardware Cooperative", "headline": "A legacy planning system replaced in under seven months.", "challenge": "One of the hardware industry's largest cooperatives, with $3B in revenue, more than 3,800 member-owned stores in over 50 countries and a 67,000-product assortment, had relied on an older replenishment system for years. It could no longer keep up with modern supply chain demands or omnichannel complexity, and the co-op needed a scalable planning platform and a partner who could migrate it quickly and under budget.", "solution": "Highspring implemented Blue Yonder Demand, Demand 360, Demand Classification, Fulfillment, Order Optimization, Slow Mover Forecasting and Replenishment Interval Optimization across 2,000 vendors and 12 distribution centers. It worked with management to define new forecasting, inventory and order planning processes, partnered with IT on interfaces, data mapping and integration testing, and delivered training and knowledge transfer, all running on Highspring's cloud services.", "impact": "The full technical go-live took less than seven months. The co-op has seen measurable gains in forecast accuracy, inventory turns, procurement planning and markdown reduction, and planners now manage by exception on a next-generation platform.", "quote": null, "placement": null, "industryGroup": "Retail & Consumer", "industry": "Retail & Consumer", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Enterprise Applications"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "<7 mo", "label": "To technical go-live"}, {"value": "2,000", "label": "Vendors on the new platform"}, {"value": "12", "label": "Distribution centers"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/diy-retailer-supply-chain-transformation/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 106, "title": "Simplifying Demand Planning for a Global Snack Manufacturer", "client": "Global Snack Food Manufacturer", "headline": "An automated planning hierarchy delivered remotely and under budget.", "challenge": "One of the world's largest snack food manufacturers, with more than $1B in revenue, 12,000-plus customer locations and 11 plants in the U.S. and Canada, had just upgraded to the latest Blue Yonder release. It needed better demand forecasting, sales and operations planning and fulfillment planning, and wanted an extension that would make Blue Yonder easier to use and simplify data management.", "solution": "Highspring recommended CORE, the newest release of its planning toolkit. CORE added two higher levels to the forecasting hierarchy based on three main attributes and builds master data automatically, sharply reducing the usual time and effort. When new products appear in the source system, CORE alerts planners and creates the data needed to plan them. The entire implementation ran remotely during COVID, with client planners joining design, testing and rollout from home.", "impact": "The project came in under budget, with lower implementation and maintenance costs and thousands of dollars saved through automated data creation and no travel. Planners faced fewer interruptions, and the company can change its planning approach just by adjusting a few attributes.", "quote": null, "placement": null, "industryGroup": "Manufacturing & Distribution", "industry": "Manufacturing & Distribution", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Digital Transformation"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "11", "label": "Plants across U.S. and Canada"}, {"value": "12,000+", "label": "Customer locations served"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/snack-manufacturer-forecasting-highspring-core/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 107, "title": "Automating Planogram Creation Across 5,500 Stores", "client": "U.S.-Based Multinational Retailer", "headline": "Automated planograms for 5,500 stores.", "challenge": "A U.S.-based multinational retailer operating hypermarkets, discount department stores and grocery stores had to create and maintain planograms across more than 250 categories and 5,500 stores. It wanted more localized planograms by store cluster or individual store, lower SG&A spent drawing them, staff freed for analysis and merchandising, and less reliance on vendor-supplied planograms, while responding faster to market changes and improving return on space.", "solution": "Highspring implemented Blue Yonder Planogram Generator using its eight-step framework: template creation, target creation, assortment strategy, product and performance data load, action list development, generation, revision and cleanup. It trained the retailer's team through three levels of courses, from a 16-hour crash course to expert-led scenarios with the client's own data and hands-on building of templates, targets and action lists.", "impact": "The retailer now has a repeatable, scalable process for generating optimized planograms in high volume. Staff have shifted from manual drawing to analysis and merchandising, the business depends less on vendors and can respond faster to market changes, and the work supports long-term SG&A reduction.", "quote": null, "placement": null, "industryGroup": "Retail & Consumer", "industry": "Retail & Consumer", "serviceGroup": ["Consulting"], "tags": ["Supply Chain Systems", "Digital Transformation"], "primary": "Supply Chain Systems", "state": "Not specified", "location": "Not specified", "stats": [{"value": "5,500", "label": "Stores covered"}, {"value": "250+", "label": "Categories automated"}], "brand": ["Highspring.com"], "source": "https://www.highspring.com/resources/case-studies/transforming-retail-planograms/", "published": "2026-03-03", "kind": "Case Study", "ownership": "Other"}, {"id": 108, "title": "Modernizing a Decades-Old Legacy System with AI", "client": "Established Consumer-Facing Enterprise", "headline": "AI-led analysis, then delivery: a low-risk, phased modernization of a critical legacy system.", "challenge": "A decades-old legacy application still powered key parts of the business, but few people fully understood how it worked. Its business logic and architecture were poorly documented, making every change risky and any modernization decision a guess.", "solution": "Instead of jumping into a rebuild, Vaco by Highspring paired AI with experienced engineers to analyze the system first. The team mapped its code, data, dependencies and business logic and translated the legacy code into readable form. A single-module proof of concept validated the approach, and the same team is now designing the future-state architecture and delivering the migration module by module.", "impact": "Leadership replaced guesswork with a clear picture of what the system actually does, and modernization is underway on a phased plan that keeps the business running. One partner carries the work from analysis through implementation, so knowledge isn't lost between phases.", "quote": null, "placement": null, "industryGroup": "Retail & Consumer", "industry": "Retail & Consumer", "serviceGroup": ["Consulting"], "tags": ["AI & Machine Learning", "Software Engineering", "Digital Transformation"], "primary": "AI & Machine Learning", "state": "New Jersey", "location": "New Jersey", "stats": [{"value": "Mapped", "label": "Code, data and business logic"}, {"value": "1", "label": "Module proven before scaling"}, {"value": "End-to-End", "label": "Analysis through implementation"}], "brand": ["Northeast Team"], "source": null, "published": "2026-11-17", "kind": "Client Success Story", "ownership": "Other", "added": "2026-11"}, {"id": 109, "title": "Standing Up a Managed iPad Fleet for a Field Sales Team", "client": "National Legal Technology & Services Company", "headline": "200 iPads under management, with a specialist starting 8 days after the first call.", "challenge": "The company planned to put 200 iPads in the hands of its field sales team after earlier device programs had fallen short. It had no iPad fleet in production and needed a repeatable way to set up devices, control access, and push and update marketing content, with that content managed by non-technical staff.", "solution": "Vaco by Highspring placed a mobile device management specialist who already knew the client's NinjaOne environment, starting 8 days after the intake call. Working independently as an advisor, not just an extra pair of hands, the consultant designed and deployed NinjaOne MDM for the fleet: a standard iPad configuration and provisioning process, workflows to distribute and refresh marketing content, role-based access, and a content process business users could run without admin rights. The consultant also weighed when Jamf would make sense against staying on NinjaOne, reviewed the wider NinjaOne setup for improvements, trained the internal IT team, and handed over as-built diagrams, data flows and configuration documentation.", "impact": "The sales team gained a managed iPad fleet with a repeatable process for provisioning devices and keeping content current. The company built it on the device-management platform it already owned instead of adding a new one, its own team can now run and upgrade the environment, and the model can extend to other devices later.", "quote": null, "placement": null, "industryGroup": "Legal", "industry": "Legal", "serviceGroup": ["Staff Augmentation", "Consulting"], "tags": ["IT Support & Service Desk", "Cloud & Infrastructure", "Digital Transformation"], "primary": "IT Support & Service Desk", "state": "New Jersey", "location": "New Jersey", "stats": [{"value": "200", "label": "iPads brought under management"}, {"value": "8 days", "label": "From intake call to start"}, {"value": "0", "label": "New platforms added"}], "brand": ["Northeast Team"], "source": null, "published": "2026-11-20", "kind": "Client Success Story", "ownership": "Other", "added": "2026-11"}];

    let k=sha256(cat(b64(NAMES_BLOB.s),enc(String(pw).trim().toLowerCase()))); for(let i=1;i<NAMES_BLOB.n;i++) k=sha256(k);

    for(let i=0;i<d.length;i+=32){ const ks=sha256(cat(k,new Uint8Array([(i/32)>>>24,(i/32)>>>16&255,(i/32)>>>8&255,(i/32)&255]))); for(let j=0;j<32&&i+j<d.length;j++) out[i+j]=d[i+j]^ks[j]; }

const STOP=new Set(['and','the','for','with','of','a','an','in','on','to','or','&']);
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function termRe(t){ const b=/^[a-z0-9]{1,3}$/.test(t)?'\\b':''; return b+reEsc(t)+b; }
function expand(w){ const out=new Set([w]); if(w.length>4&&w.endsWith('s')) out.add(w.slice(0,-1)); SYN.forEach(([g,sp])=>{ if(g.includes(w)) sp.forEach(x=>out.add(x)); }); return new RegExp([...out].map(termRe).join('|'),'i'); }
function qTerms(){ return S.q.toLowerCase().replace(/[",]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)); }
function fieldsOf(c){ return [[c.title,6],[c.headline,3],[[...c.tags,c.primary||'',...c.serviceGroup].join(' · '),3],[[c.client,(NM(c)||{}).c||'',c.industry,c.industryGroup,c.kind,c.ownership,c.placement||''].join(' · '),2],[[c.challenge,c.solution,c.impact,(c.quote&&c.quote.text)||'',c.stats.map(x=>x.value+' '+x.label).join(' · '),c.location,c.state,c.brand.join(' ')].join(' · '),1]]; }
function score(c){ const ts=qTerms(); if(!ts.length) return 1; let tot=0; const F=fieldsOf(c);
  for(const t of ts){ const re=expand(t), ex=new RegExp(termRe(t),'i'); let best=0; for(const [txt,w] of F){ if(re.test(txt||'')) best+=w*(ex.test(txt||'')?2:1); } if(!best) return 0; tot+=best; } return tot; }
function snippet(c){ const ts=qTerms(); if(!ts.length) return ''; const res=ts.map(expand); const body=[c.challenge,c.solution,c.impact].join(' ');
  if(res.every(r=>r.test(c.title))) return ''; let i=-1; for(const r of res){ const mm=body.match(r); if(mm){ i=mm.index; break; } } if(i<0) return '';
  const a=Math.max(0,body.lastIndexOf(' ',Math.max(0,i-60))), b=body.indexOf(' ',Math.min(body.length,i+90)); let t=esc(body.slice(a,b<0?body.length:b).trim());
  res.forEach(r=>{ t=t.replace(new RegExp(r.source,'gi'),x=>`<mark>${x}</mark>`); }); return (a>0?'…':'')+t+(b>0?'…':''); }
function hl(t){ let h=esc(t); qTerms().map(expand).forEach(r=>{ h=h.replace(new RegExp(r.source,'gi'),x=>`<mark>${x}</mark>`); }); return h; }
function matches(c, skip){
  for (const [k,,field] of FILTERS){
    if (k===skip) continue;
    const set=S.f[k]; if (!set.size) continue;
    if (!vals(c,field).some(v=>set.has(v))) return false;
  }
  if (S.q.trim() && !score(c)) return false;
  return true;
}

/* ---------- count up ---------- */
function parseNum(v){ const m=String(v).match(/^([+−\-$]?)(\d[\d,]*)(\.?\d*)(.*)$/); if(!m) return null; return {pre:m[1], n:parseFloat((m[2]+m[3]).replace(/,/g,'')), dec:(m[3]||'').length>1?m[3].length-1:0, post:m[4]}; }
function countUp(nodes){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return; io.unobserve(e.target);
    const el=e.target; el.closest('.stat')?.classList.add('vis');
    const raw=el.dataset.count; const p=parseNum(raw); if(!p||matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=raw; return; }
    const t0=performance.now(), d=1100;
    (function tick(t){ const k=Math.min(1,(t-t0)/d), ease=1-Math.pow(1-k,3);
      el.textContent=p.pre+(p.n*ease).toFixed(p.dec).replace(/\B(?=(\d{3})+(?!\d))/g,',')+p.post;
      if(k<1) requestAnimationFrame(tick); else el.textContent=raw; })(t0);
  }),{threshold:.3});
  nodes.forEach(n=>io.observe(n));
  setTimeout(()=>nodes.forEach(n=>{ if(n.closest('.stat')&&!n.closest('.stat').classList.contains('vis')){ io.unobserve(n); n.closest('.stat').classList.add('vis'); n.textContent=n.dataset.count; } }),2500);
}

    dc.textContent = !cc ? 'Client success stories are representative summaries of our work, provided for informational purposes only. Client names and identifying details are withheld or generalized to protect confidentiality; they are not client endorsements or references. Case studies are summarized from their original published source on vaco.com or highspring.com. Results are specific to each engagement and do not guarantee future outcomes. © 2026 Highspring LLC. All rights reserved.'
      : cc.kind==='Case Study' ? 'Case study. Provided for informational purposes only. Results are specific to that engagement and do not guarantee future outcomes. © 2026 Highspring LLC. All rights reserved.'
      : 'Client success story. This is a representative summary of our work, provided for informational purposes only. Client names and identifying details are withheld or generalized to protect confidentiality. It is not a client endorsement or reference, and the client should not be contacted on its basis. Results are specific to this engagement and do not guarantee future outcomes. © 2026 Highspring LLC. All rights reserved.'; } }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
/* ---------- motion: scroll reveal + card spotlight ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let _rio=null;
function reveal(){
  const els=document.querySelectorAll('.rv:not(.in)');
  if(RM||!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  if(!_rio) _rio=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); _rio.unobserve(e.target);} }),{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  els.forEach(e=>_rio.observe(e));
}
document.addEventListener('pointermove',e=>{ const c=e.target.closest&&e.target.closest('.card'); if(!c) return; const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px'); },{passive:true});

async function dlCase(id,btn){
  const c=BYID[id]; if(!c) return;
  let html='';
  try{ const r=await fetch(location.href.split('#')[0],{cache:'no-store'}); if(r.ok) html=await r.text(); }catch(err){}
  if(!html||html.indexOf('const CFG = {};')<0) html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  html=html.replace('const CFG = {};','const CFG = {"lock":"case-'+id+'"};');
  html=html.replace(/<title>[^<]*<\/title>/,'<title>'+c.title.replace(/[<&]/g,'')+' · '+c.kind+' · Highspring | Vaco</title>');
  const slug=(c.kind+' - '+c.title).replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim();
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=slug+'.html'; document.body.appendChild(a); a.click(); a.remove();
  if(btn){ const o=btn.textContent; btn.textContent='Downloaded'; setTimeout(()=>btn.textContent=o,1600); }
}

/* ---------- events ---------- */
function ringGo(k){ const r=RINGDEF.find(x=>x[0]===k); if(!r) return;
  if(CFG.lock){ window.open(location.href.split(/[?#]/)[0]+'#library','_blank'); return; }
  S.f.service=new Set(r[6]); S.ftab='service'; if(location.hash==='#library'||location.hash==='') route(); else location.hash='#library';
  setTimeout(()=>{ const g=$('#grid'); if(g) g.scrollIntoView({behavior:'smooth',block:'start'}); },80); toast(`${r[1]} ${r[2]}`.trim()+' stories'); }
document.addEventListener('click',e=>{ const g=e.target.closest&&e.target.closest('[data-ring]'); if(g){ ringGo(g.dataset.ring); } });
document.addEventListener('keydown',e=>{ const g=e.target.closest&&e.target.closest('[data-ring]'); if(g&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); ringGo(g.dataset.ring); } });
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  const d=t.dataset;
  if (d.dl){ e.preventDefault(); dlCase(+d.dl, t); return; }
  if (d.add){ e.preventDefault(); e.stopPropagation(); toggleSel(+d.add); return; }
  if (d.ftab){ S.ftab=d.ftab; renderFilters(); return; }
  if (d.chip!==undefined){ const set=S.f[S.ftab]; set.has(d.chip)?set.delete(d.chip):set.add(d.chip); renderFilters(); renderGrid(); return; }
  if (d.unchip){ const [k,...v]=d.unchip.split('|'); S.f[k].delete(v.join('|')); renderFilters(); renderGrid(); return; }
  if (d.clear!==undefined){ Object.values(S.f).forEach(s=>s.clear()); S.q=''; renderFilters(); renderGrid(); return; }
  if (d.filter){ e.preventDefault(); const [k,...v]=d.filter.split('|'); Object.values(S.f).forEach(s=>s.clear()); S.q=''; S.f[k].add(v.join('|')); S.ftab=k; if(location.hash==='#library') route(); else location.hash='#library'; return; }
  if (d.go){ location.hash='#case-'+d.go; return; }
  if (d.ac!==undefined){ const sec=t.closest('.ac'); const o=!sec.classList.contains('open'); sec.classList.toggle('open',o); t.setAttribute('aria-expanded',o); const all=[...document.querySelectorAll('.ac')]; const b=$('[data-acall]'); if(b) b.textContent=all.every(x=>x.classList.contains('open'))?'Collapse all':'Expand all'; return; }
  if (d.acall!==undefined){ const all=[...document.querySelectorAll('.ac')]; const o=!all.every(x=>x.classList.contains('open')); all.forEach(x=>{x.classList.toggle('open',o); x.querySelector('.ach').setAttribute('aria-expanded',o);}); t.textContent=o?'Collapse all':'Expand all'; return; }
  if (d.step){ const [id,j]=d.step.split('|').map(Number); S.story[id]=j; $('#story').innerHTML=stepStory(BYID[id]); return; }
  if (d.layout){ const [s,l]=d.layout.split('|'); S.layouts[s]=l; renderCollection(s); return; }
  if (d.feature){ const [s,id]=d.feature.split('|'); S.featured[s]=+id; $('#colbody').innerHTML=layoutHTML(colDef(s),'featured'); $('#colbody').scrollIntoView({behavior:'smooth'}); return; }
  if (d.open){ openDrawer(+d.open); return; }
  if (d.close!==undefined){ closeDrawer(); return; }
  if (d.row){ const x=$('#opx-'+d.row), open=!x.classList.contains('open'); x.classList.toggle('open',open); t.setAttribute('aria-expanded',open); return; }
  if (d.expandall!==undefined){ const rows=document.querySelectorAll('.op-r'), anyClosed=[...rows].some(r=>r.getAttribute('aria-expanded')==='false');
    rows.forEach(r=>{ r.setAttribute('aria-expanded',anyClosed); $('#opx-'+r.dataset.row).classList.toggle('open',anyClosed); }); t.textContent=anyClosed?'Collapse all':'Expand all'; return; }
  if (d.clearsel!==undefined){ S.sel=[]; persist(); route(); return; }
  if (d.copy){ const url=location.href.split(/[?#]/)[0]+'?story='+slugOf(BYID[+d.copy.replace('case-','')].title);
    const ok=()=>toast('<b>✓ Story link copied</b><span>This link shows only this story. Safe to send to clients.</span><span class="tw">Never send the full library link.</span>',4200);
    const fb=()=>{ window.prompt('Copy this link to send just this story:',url); };
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(ok,fb); else fb(); return; }
});
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{
  if (e.key==='Escape') closeDrawer();
  if (S._view==='case' && S.storyMode==='steps' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const id=+(CFG.lock||location.hash).split('-').pop(); const j=Math.max(0,Math.min(2,(S.story[id]||0)+(e.key==='ArrowRight'?1:-1))); S.story[id]=j; const st=$('#story'); if(st) st.innerHTML=stepStory(BYID[id]);
  }
});
route();
</script>
